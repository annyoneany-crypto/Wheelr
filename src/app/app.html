
<!-- Header -->
<wl-header></wl-header>

<a href="/info" target="_self" rel="noopener noreferrer">
  <div class="fixed top-28 left-8
    w-12 h-12 rounded-full
    border border-white/10 bg-neutral-800/60
    flex items-center justify-center hover:cursor-pointer
    transition-all duration-300 ease-in-out z-50
    hover:border-yellow-400 hover:ring-2 hover:ring-yellow-400/40">
    <i class="fa-solid fa-info text-white/80 z-50"></i>
  </div>
</a>
<a href="/donation" target="_self" rel="noopener noreferrer">
  <div class="fixed top-44 left-8
    w-12 h-12 rounded-full
    border border-white/10 bg-neutral-800/60
    flex items-center justify-center hover:cursor-pointer
    transition-all duration-300 ease-in-out z-50 
    hover:border-yellow-400 hover:ring-2 hover:ring-yellow-400/40">
    <i class="fa-solid fa-heart text-white/80 z-50"></i>
  </div>
</a>
<!-- Page Outlet -->
<router-outlet></router-outlet>

<!-- Creator credit -->
<div class="fixed bottom-2 left-4 
  flex flex-col items-center gap-2 p-4
  border border-white/10 bg-neutral-800/50 
  backdrop-blur-sm rounded-md
  text-xs text-white  opacity-70
  hover:opacity-100 hover:cursor-pointer transition-opacity"
  (click)="openCreatorLink()">
  <span>Created by AnnyoneAny</span>
  <div class="invert">
    <img
      src="/twitter-logo.webp"
      width="16"
      height="16"
      alt="Twitter"
      class="h-4 w-4" />
  </div>
</div>

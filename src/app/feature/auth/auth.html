@if (isOpen()) {
    <div
        class="fixed inset-0 z-90 bg-neutral-950/80 backdrop-blur-md flex items-center justify-center px-4"
        role="dialog"
        aria-modal="true"
        aria-label="Login modal"
        (click)="closeModal()">
        <section
            class="wl-animate-modal w-full max-w-md rounded-2xl border border-white/15 bg-gradient-to-b from-neutral-900/98 to-neutral-950/98 p-6 shadow-[0_25px_60px_rgba(0,0,0,0.5)]"
            (click)="$event.stopPropagation()">
            <div class="mb-5 flex items-start justify-between gap-4">
                <div>
                    <h2 class="text-xl font-black text-white">
                        @if (isRegisterMode()) {
                            Create account
                        } @else {
                            Sign in
                        }
                    </h2>
                    <p class="mt-1 text-sm text-white/50">Choose how you want to authenticate</p>
                </div>
                <button
                    type="button"
                    class="h-9 w-9 rounded-xl border border-white/10 bg-white/[0.04] text-white/70 hover:bg-white/10 hover:text-white transition-all duration-200 inline-flex items-center justify-center"
                    aria-label="Close auth modal"
                    (click)="closeModal()">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>

            <!-- <form class="space-y-4" [formGroup]="authForm" (ngSubmit)="submitWithEmailAndPassword()">
                <label class="block text-sm text-white/90" for="auth-email">Email</label>
                <input

                    type="email"

                    class="w-full rounded-xl border border-white/20 bg-neutral-800 px-3 py-2 text-white outline-none focus:border-yellow-400"
                    autocomplete="email"
                    placeholder="you@example.com" />

                <label class="block text-sm text-white/90" for="auth-password">Password</label>
                <input
                    id="auth-password"
                    type="password"
                    formControlName="password"
                    class="w-full rounded-xl border border-white/20 bg-neutral-800 px-3 py-2 text-white outline-none focus:border-yellow-400"
                    autocomplete="current-password"
                    placeholder="********" />

                @if (isRegisterMode()) {
                    <label class="block text-sm text-white/90" for="auth-confirm-password">Confirm password</label>
                    <input
                        id="auth-confirm-password"
                        type="password"
                        formControlName="confirmPassword"
                        class="w-full rounded-xl border border-white/20 bg-neutral-800 px-3 py-2 text-white outline-none focus:border-yellow-400"
                        autocomplete="new-password"
                        placeholder="********" />
                }

                <button
                    type="submit"
                    class="secondaryButton w-full inline-flex justify-center border-yellow-400/50!"
                    [disabled]="isAuthSubmitLoading()">
                    @if (isRegisterMode()) {
                        Create account with email and password
                    } @else {
                        Sign in with email and password
                    }
                </button>
            </form>

            <button
                type="button"
                class="mt-3 text-sm text-yellow-300 hover:text-yellow-200 transition-colors"
                [disabled]="isAuthSubmitLoading()"
                (click)="toggleAuthMode()">
                @if (isRegisterMode()) {
                    Already have an account? Sign in
                } @else {
                    Don't have an account? Create one
                }
            </button> -->

            <div class="my-5 flex items-center gap-3">
                <div class="h-px flex-1 bg-gradient-to-r from-transparent via-white/15 to-transparent"></div>
            </div>

            <button
                type="button"
                class="w-full inline-flex items-center justify-center gap-3 rounded-xl border border-white/15 bg-white/[0.06] px-4 py-3 text-sm font-semibold text-white hover:bg-white/10 hover:border-white/25 hover:shadow-[0_0_20px_rgba(255,255,255,0.05)] transition-all duration-200 disabled:opacity-50"
                [disabled]="isAuthSubmitLoading()"
                (click)="loginWithGoogle()">
                <i class="fa-brands fa-google text-lg" aria-hidden="true"></i>
                Sign in with Google
            </button>

            @if (authError()) {
                <div class="mt-4 min-h-6" aria-live="polite">
                    <p class="rounded-xl border border-red-400/20 bg-red-500/10 px-3 py-2.5 text-sm text-red-300">{{ authError() }}</p>
                </div>
            }
        </section>
    </div>
}

@if (isOpen()) {
    <div
        class="fixed inset-0 z-90 bg-neutral-950/80 backdrop-blur-sm flex items-center justify-center px-4"
        role="dialog"
        aria-modal="true"
        aria-label="Login modal"
        (click)="closeModal()">
        <section
            class="w-full max-w-md rounded-2xl border border-white/20 bg-neutral-900/95 p-6 shadow-2xl"
            (click)="$event.stopPropagation()">
            <div class="mb-4 flex items-start justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-white">
                        @if (isRegisterMode()) {
                            Crea profilo
                        } @else {
                            Accedi
                        }
                    </h2>
                    <p class="mt-1 text-sm text-white/70">Scegli come vuoi autenticarti</p>
                </div>
                <button
                    type="button"
                    class="secondaryButton inline-flex items-center gap-2"
                    aria-label="Close auth modal"
                    (click)="closeModal()">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>

            <form class="space-y-4" [formGroup]="authForm" (ngSubmit)="submitWithEmailAndPassword()">
                <label class="block text-sm text-white/90" for="auth-email">Email</label>
                <input
                    id="auth-email"
                    type="email"
                    formControlName="email"
                    class="w-full rounded-xl border border-white/20 bg-neutral-800 px-3 py-2 text-white outline-none focus:border-yellow-400"
                    autocomplete="email"
                    placeholder="you@example.com" />

                <label class="block text-sm text-white/90" for="auth-password">Password</label>
                <input
                    id="auth-password"
                    type="password"
                    formControlName="password"
                    class="w-full rounded-xl border border-white/20 bg-neutral-800 px-3 py-2 text-white outline-none focus:border-yellow-400"
                    autocomplete="current-password"
                    placeholder="********" />

                @if (isRegisterMode()) {
                    <label class="block text-sm text-white/90" for="auth-confirm-password">Conferma password</label>
                    <input
                        id="auth-confirm-password"
                        type="password"
                        formControlName="confirmPassword"
                        class="w-full rounded-xl border border-white/20 bg-neutral-800 px-3 py-2 text-white outline-none focus:border-yellow-400"
                        autocomplete="new-password"
                        placeholder="********" />
                }

                <button
                    type="submit"
                    class="secondaryButton w-full inline-flex justify-center border-yellow-400/50!"
                    [disabled]="isAuthSubmitLoading()">
                    @if (isRegisterMode()) {
                        Crea profilo con email e password
                    } @else {
                        Accedi con email e password
                    }
                </button>
            </form>

            <button
                type="button"
                class="mt-3 text-sm text-yellow-300 hover:text-yellow-200 transition-colors"
                [disabled]="isAuthSubmitLoading()"
                (click)="toggleAuthMode()">
                @if (isRegisterMode()) {
                    Hai gia un account? Accedi
                } @else {
                    Non hai un account? Crea profilo
                }
            </button>

            <div class="my-4 flex items-center gap-3">
                <div class="h-px flex-1 bg-white/15"></div>
                <span class="text-xs uppercase tracking-widest text-white/50">Oppure</span>
                <div class="h-px flex-1 bg-white/15"></div>
            </div>

            <button
                type="button"
                class="secondaryButton w-full inline-flex items-center justify-center gap-2 border-white/30!"
                [disabled]="isAuthSubmitLoading()"
                (click)="loginWithGoogle()">
                <i class="fa-brands fa-google" aria-hidden="true"></i>
                Accedi con Google
            </button>

            <div class="mt-4 min-h-6" aria-live="polite">
                @if (authError()) {
                    <p class="rounded-lg border border-red-400/30 bg-red-500/10 px-3 py-2 text-sm text-red-200">{{ authError() }}</p>
                }
            </div>
        </section>
    </div>
}

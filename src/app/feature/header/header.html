<header class="fixed top-0 left-0 w-full px-6 py-4 flex justify-between items-center z-20 bg-neutral-950/70 backdrop-blur-xl border-b border-white/[0.06] shadow-[0_4px_30px_rgba(0,0,0,0.4)]" role="banner" aria-label="Main header">
    <a class="flex gap-4 items-center hover:cursor-pointer group" [routerLink]="['/']" aria-label="Go to homepage">
        <img src="/Logo.webp" alt="GiveawayWheel logo" class="w-9 h-9 transition-transform duration-300 group-hover:scale-110">
        <div class="relative">
          <!-- Animated glowing orbs container -->
          <div class="absolute inset-0 animate-spin-slow opacity-70" style="width: 140px; height: 60px;">
            <div class="absolute w-6 h-6 bg-red-500 rounded-full blur-xl" style="top: -10px; left: 10px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);"></div>
            <div class="absolute w-6 h-6 bg-yellow-400 rounded-full blur-xl" style="top: 10px; right: 20px; box-shadow: 0 0 20px rgba(250, 204, 21, 0.8);"></div>
            <div class="absolute w-5 h-5 bg-blue-500 rounded-full blur-xl" style="bottom: 5px; left: 0px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);"></div>
            <div class="absolute w-6 h-6 bg-purple-500 rounded-full blur-xl" style="top: 5px; right: 5px; box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);"></div>
          </div>
          <h1 class="relative z-10 text-3xl uppercase font-black text-white truncate tracking-wide drop-shadow-[0_0_12px_rgba(245,158,11,0.3)]">
              Wheelr
          </h1>
        </div>
        @if (isWheelRoute()) {
          <span
            class="relative z-10 inline-flex items-center gap-1.5 rounded-full border border-amber-400/40 bg-amber-400/10 px-2.5 py-1 text-sm font-bold text-amber-200"
            [title]="wheelConfigurator.namesCount() + ' names on the wheel'"
            aria-label="Number of names on the wheel">
            <i class="fa-solid fa-users text-xs" aria-hidden="true"></i>
            {{ wheelConfigurator.namesCount() }}
          </span>
        }
    </a>

        @if (showSelectedWheelBadge()) {
            <div class="absolute left-1/2 -translate-x-1/2 z-30 pointer-events-none hidden md:block">
                <div class="rounded-full border border-amber-400/40 bg-neutral-950/70 backdrop-blur-sm px-5 py-2 text-center shadow-[0_0_24px_rgba(245,158,11,0.15)]">
                    <p class="text-[0.6rem] uppercase tracking-[0.22em] text-amber-300/80 font-medium">Selected Wheel</p>
                    <div class="mt-0.5 flex items-center justify-center gap-2 pointer-events-auto">
                        <p class="text-sm font-bold text-white">{{ selectedWheelName() }}</p>
                        <button
                            type="button"
                            class="inline-flex h-6 w-6 items-center justify-center text-white/90 hover:cursor-pointer transition-colors"
                            (click)="requestRenameModal()"
                            [attr.aria-label]="showIndependentPreview() ? 'Rename visible wheels' : 'Rename selected wheel'">
                            <i class="fa-solid fa-pen" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>
        }

    <!-- <i class="fa-solid fa-sun"></i> -->
    <div class="flex gap-4 items-center justify-center" role="navigation" aria-label="Header actions">
        <button
            type="button"
            (click)="onAuthButtonClick()"
            class="secondaryButton max-w-52 h-11 inline-flex items-center border-yellow-400/50!"
            [disabled]="authService.loading()"
            [attr.aria-label]="authButtonAriaLabel()"
            [title]="authButtonAriaLabel()">
            @if (!authService.isLoggedIn()) {
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            } @else {
                <i class="fa-solid fa-user-check" aria-hidden="true"></i>
                <!-- <span class="truncate">{{ authService.email() }}</span> -->
            }
        </button>

        <button
            type="button"
            (click)="toggleMenu()"
            class="secondaryButton inline-flex h-11 items-center gap-2 border-yellow-400/50!"
            [attr.aria-expanded]="isMenuOpen()"
            aria-label="Open main menu">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
                <!-- <span>Menu</span> -->
        </button>
    </div>
</header>

<div [class.hidden]="!isMenuOpen()">
    <div
        class="fixed inset-0 z-80 bg-neutral-950/95 backdrop-blur-2xl flex items-center justify-center"
        role="dialog"
        aria-modal="true"
        aria-label="Main menu"
        (click)="closeMenu()">
        <div
            class="absolute top-5 right-6">
            <button
                type="button"
                class="secondaryButton inline-flex items-center gap-2"
                aria-label="Close menu"
                (click)="closeMenu()">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                <span>Close</span>
            </button>
        </div>

        <nav
            class="w-full max-w-xl px-6"
            aria-label="Main pages"
            (click)="$event.stopPropagation()">
            <ul class="grid gap-5 text-center">
                <li>
                    <a
                        [routerLink]="['/']"
                        (click)="closeMenu()"
                        aria-label="Go to Wheelr page"
                        class="group block rounded-2xl border border-white/10 bg-gradient-to-br from-white/[0.06] to-white/[0.02] px-6 py-6 text-2xl font-black text-white hover:border-amber-400/40 hover:shadow-[0_0_30px_rgba(245,158,11,0.12)] transition-all duration-300">
                        <span class="group-hover:text-amber-300 transition-colors">🎡 Wheelr</span>
                    </a>
                </li>
                <li>
                    <a
                        [routerLink]="['/info']"
                        (click)="closeMenu()"
                        aria-label="Go to Info page"
                        class="group block rounded-2xl border border-white/10 bg-gradient-to-br from-white/[0.06] to-white/[0.02] px-6 py-6 text-2xl font-black text-white hover:border-amber-400/40 hover:shadow-[0_0_30px_rgba(245,158,11,0.12)] transition-all duration-300">
                        <span class="group-hover:text-amber-300 transition-colors">ℹ️ Info</span>
                    </a>
                </li>
                <li>
                    <a
                        [routerLink]="['/donation']"
                        (click)="closeMenu()"
                        aria-label="Go to Donation page"
                        class="group block rounded-2xl border border-white/10 bg-gradient-to-br from-white/[0.06] to-white/[0.02] px-6 py-6 text-2xl font-black text-white hover:border-amber-400/40 hover:shadow-[0_0_30px_rgba(245,158,11,0.12)] transition-all duration-300">
                        <span class="group-hover:text-amber-300 transition-colors">💝 Donation</span>
                    </a>
                </li>
                <li>
                    <a
                        href="https://annyoneany-crypto.github.io/Wheelr/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Open Wheelr wiki (opens in a new tab)"
                        class="group block rounded-2xl border border-white/10 bg-gradient-to-br from-white/[0.06] to-white/[0.02] px-6 py-6 text-2xl font-black text-white hover:border-amber-400/40 hover:shadow-[0_0_30px_rgba(245,158,11,0.12)] transition-all duration-300">
                        <span class="group-hover:text-amber-300 transition-colors">📖 Wiki</span>
                    </a>
                </li>
            </ul>

        </nav>

        <a
            href="https://x.com/AnnyoneAny"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="AnnyoneAny Twitter profile"
            class="absolute bottom-8 left-1/2 -translate-x-1/2 transition-transform hover:scale-105 invert"
            (click)="$event.stopPropagation()">
            <img
                ngSrc="/twitter-logo.webp"
                width="60"
                height="60"
                alt="Twitter"
                class="h-14 w-14 md:h-14 md:w-14" />
        </a>
    </div>
</div>

<wl-auth [isOpen]="isAuthModalOpen()" (closeRequested)="closeAuthModal()"></wl-auth>

<wl-user-info
    [isOpen]="isUserPanelOpen()"
    [email]="authService.email()"
    (closeRequested)="closeUserPanel()"
    (logoutRequested)="logoutFromUserPanel()"></wl-user-info>

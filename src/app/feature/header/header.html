<div class="fixed top-0 left-0 w-full p-6 flex justify-between items-center z-20 bg-neutral-800/60 backdrop-blur-md border-b border-white/10">
    <div class="flex gap-4">
        <img src="/Logo.png" alt="Logo" class="w-8 h-8">
        <div class="relative">
          <!-- Animated glowing orbs container -->
          <div class="absolute inset-0 animate-spin-slow" style="width: 140px; height: 60px;">
            <!-- Red orb -->
            <div class="absolute w-6 h-6 bg-red-500 rounded-full blur-xl" style="top: -10px; left: 10px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);"></div>
            <!-- Yellow orb -->
            <div class="absolute w-6 h-6 bg-yellow-400 rounded-full blur-xl" style="top: 10px; right: 20px; box-shadow: 0 0 20px rgba(250, 204, 21, 0.8);"></div>
            <!-- Blue orb -->
            <div class="absolute w-5 h-5 bg-blue-500 rounded-full blur-xl" style="bottom: 5px; left: 0px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);"></div>
            <!-- Purple orb -->
            <div class="absolute w-6 h-6 bg-purple-500 rounded-full blur-xl" style="top: 5px; right: 5px; box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);"></div>
          </div>
          <!-- Text -->
          <h1 class="relative z-10 text-3xl uppercase font-bold text-white">
              Wheelr
          </h1>
        </div>
    </div>
    <!-- <i class="fa-solid fa-sun"></i> -->
    <div class="flex gap-4 items-center justify-center">
        <button
            type="button"
            (click)="toggleMenu()"
            class="secondaryButton inline-flex items-center gap-2 border-yellow-400/50!"
            [attr.aria-expanded]="isMenuOpen()"
            aria-label="Open main menu">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
                <span>Menu</span>
        </button>
    </div>
</div>

@if (isMenuOpen()) {
    <div
        class="fixed inset-0 z-80 bg-neutral-900/95 backdrop-blur-md flex items-center justify-center"
        role="dialog"
        aria-modal="true"
        aria-label="Main menu"
        (click)="closeMenu()">
        <div
            class="absolute top-6 right-6">
            <button
                type="button"
                class="secondaryButton inline-flex items-center gap-2"
                aria-label="Close menu"
                (click)="closeMenu()">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                <span>Close</span>
            </button>
        </div>

        <nav
            class="w-full max-w-xl px-6"
            aria-label="Main pages"
            (click)="$event.stopPropagation()">
            <ul class="grid gap-4 text-center">
                <li>
                    <a
                        [routerLink]="['/']"
                        (click)="closeMenu()"
                        class="block rounded-2xl border border-white/15 bg-neutral-800/60 px-6 py-5 text-2xl font-bold text-white hover:bg-neutral-700/70 transition-colors">
                        🎡 Wheelr
                    </a>
                </li>
                <li>
                    <a
                        [routerLink]="['/info']"
                        (click)="closeMenu()"
                        class="block rounded-2xl border border-white/15 bg-neutral-800/60 px-6 py-5 text-2xl font-bold text-white hover:bg-neutral-700/70 transition-colors">
                        ℹ️ Info
                    </a>
                </li>
                <li>
                    <a
                        [routerLink]="['/donation']"
                        (click)="closeMenu()"
                        class="block rounded-2xl border border-white/15 bg-neutral-800/60 px-6 py-5 text-2xl font-bold text-white hover:bg-neutral-700/70 transition-colors">
                        💝 Donation
                    </a>
                </li>
            </ul>

        </nav>

        <a
            href="https://x.com/AnnyoneAny"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="AnnyoneAny Twitter profile"
            class="absolute bottom-8 left-1/2 -translate-x-1/2 transition-transform hover:scale-105 invert"
            (click)="$event.stopPropagation()">
            <img
                ngSrc="/twitter-logo.png"
                width="60"
                height="60"
                alt="Twitter"
                class="h-14 w-14 md:h-14 md:w-14" />
        </a>
    </div>
}

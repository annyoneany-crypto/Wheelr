@if (isOpen()) {
    <div
        class="fixed inset-0 z-90 bg-neutral-950/70 backdrop-blur-sm flex items-center justify-center px-4"
        role="dialog"
        aria-modal="true"
        aria-label="Account panel"
        (click)="closePanel()">
        <section
            class="w-full max-w-sm rounded-2xl border border-white/20 bg-neutral-900/95 p-6 shadow-2xl"
            (click)="$event.stopPropagation()">
            <div class="mb-4 flex items-start justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-white">Your account</h2>
                    <p class="mt-1 text-sm text-white/70">You are signed in as</p>
                </div>
                <button
                    type="button"
                    class="secondaryButton inline-flex items-center gap-2"
                    aria-label="Close account panel"
                    (click)="closePanel()">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>

            <p class="mb-5 rounded-xl border border-white/15 bg-neutral-800/70 px-4 py-3 text-sm text-white break-all">
                {{ email() }}
            </p>

            <button
                type="button"
                class="secondaryButton w-full inline-flex items-center justify-center gap-2 border-red-400/40!"
                (click)="requestLogout()">
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                Sign out
            </button>
        </section>
    </div>
}

@if (isOpen()) {
    <div
        class="fixed inset-0 z-90 bg-neutral-950/80 backdrop-blur-md flex items-center justify-center px-4"
        role="dialog"
        aria-modal="true"
        aria-label="Account panel"
        (click)="closePanel()">
        <section
            class="wl-animate-modal w-full max-w-sm rounded-2xl border border-white/15 bg-gradient-to-b from-neutral-900/98 to-neutral-950/98 p-6 shadow-[0_25px_60px_rgba(0,0,0,0.5)]"
            (click)="$event.stopPropagation()">
            <div class="mb-5 flex items-start justify-between gap-4">
                <div>
                    <h2 class="text-xl font-black text-white">Your account</h2>
                    <p class="mt-1 text-sm text-white/50">You are signed in as</p>
                </div>
                <button
                    type="button"
                    class="h-9 w-9 rounded-xl border border-white/10 bg-white/[0.04] text-white/70 hover:bg-white/10 hover:text-white transition-all duration-200 inline-flex items-center justify-center"
                    aria-label="Close account panel"
                    (click)="closePanel()">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>

            <p class="mb-5 rounded-xl border border-white/10 bg-white/[0.04] px-4 py-3 text-sm text-white/80 break-all">
                {{ email() }}
            </p>

            <button
                type="button"
                class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-red-400/30 bg-red-500/10 px-4 py-3 text-sm font-semibold text-red-300 hover:bg-red-500/20 hover:border-red-400/50 transition-all duration-200"
                (click)="requestLogout()">
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                Sign out
            </button>
        </section>
    </div>
}

<div class="fixed
  w-12 h-12 rounded-xl
  border border-white/[0.08] bg-neutral-950/60 backdrop-blur-sm
  flex lg:hidden items-center justify-center hover:cursor-pointer
  transition-all duration-300 ease-in-out z-50
  hover:border-amber-400/50 hover:bg-amber-400/10 hover:shadow-[0_0_16px_rgba(245,158,11,0.15)]"
  [class.top-26]="!uiChromeHidden()"
  [class.top-12]="uiChromeHidden()"
  [class.border-amber-400/50]="mobileActionsExpanded()"
  [class.ring-0]="mobileActionsExpanded()"
  [class.bg-amber-400/10]="mobileActionsExpanded()"
  [class.right-8]="!showPanelSettings()"
  [class.right-[21rem]]="showPanelSettings()"
  [class.lg:right-100]="showPanelSettings()"
  role="button"
  tabindex="0"
  [attr.aria-label]="mobileMenuAriaLabel()"
  [attr.aria-expanded]="mobileActionsExpanded()"
  aria-controls="mobile-action-buttons"
  (click)="toggleMobileActions()"
  (keydown.enter)="toggleMobileActions()"
  (keydown.space)="toggleMobileActions(); $event.preventDefault()">
  <i class="fa-solid fa-chevron-down text-white/70" aria-hidden="true"></i>
</div>

<div class="fixed top-42 lg:top-28 wl-mobile-action
  w-12 h-12 rounded-xl
  border border-white/[0.08] bg-neutral-950/60 backdrop-blur-sm
  flex items-center justify-center hover:cursor-pointer
  transition-all duration-300 ease-in-out z-50
  hover:border-amber-400/50 hover:bg-amber-400/10 hover:shadow-[0_0_16px_rgba(245,158,11,0.15)]"
  id="mobile-action-buttons"
  [class.wl-mobile-action-hidden]="isMobileActionMenuCollapsed()"
  [class.wl-ui-hidden]="uiChromeHidden()"
  [class.border-amber-400/50]="isPanelActive('users')"
  [class.ring-0]="isPanelActive('users')"
  [class.bg-amber-400/10]="isPanelActive('users')"
  [class.right-8]="!showPanelSettings()"
  [class.right-[21rem]]="showPanelSettings()"
  [class.lg:right-100]="showPanelSettings()"
  role="button"
  tabindex="0"
  aria-label="Open users panel"
  (transitionend)="requestUsersButtonTransitionEnd()"
  (click)="requestTogglePanel('users')"
  (keydown.enter)="requestTogglePanel('users')"
  (keydown.space)="requestTogglePanel('users'); $event.preventDefault()">
  <i class="fa-solid fa-user-plus text-white/70 z-50" aria-hidden="true"></i>
</div>

  [class.lg:top-108]="!uiChromeHidden()"
  [class.top-10]="uiChromeHidden()"
  [class.border-amber-400/50]="uiChromeHidden()"
  [class.ring-0]="uiChromeHidden()"
  [class.bg-amber-400/10]="uiChromeHidden()"

@if (canShowQrButton()) {
  <div class="fixed wl-mobile-action
    w-12 h-12 rounded-xl
    border border-white/[0.08] bg-neutral-950/60 backdrop-blur-sm
    flex items-center justify-center hover:cursor-pointer
    transition-all duration-300 ease-in-out z-50
    hover:border-amber-400/50 hover:bg-amber-400/10 hover:shadow-[0_0_16px_rgba(245,158,11,0.15)]"
    [class.wl-mobile-action-hidden]="isMobileActionMenuCollapsed()"
    [class.wl-ui-hidden]="uiChromeHidden()"
    [class.border-amber-400/50]="qrModalOpen()"
    [class.ring-0]="qrModalOpen()"
    [class.bg-amber-400/10]="qrModalOpen()"
    [class.top-[35rem]]="!uiChromeHidden()"
    [class.lg:top-124]="!uiChromeHidden()"
    [class.top-20]="uiChromeHidden()"
    [class.right-8]="!showPanelSettings()"
    [class.right-[21rem]]="showPanelSettings()"
    [class.lg:right-100]="showPanelSettings()"
    role="button"
    tabindex="0"
    aria-label="Open wheel QR code"
    (click)="requestOpenQr()"
    (keydown.enter)="requestOpenQr()"
    (keydown.space)="requestOpenQr(); $event.preventDefault()">
    <i class="fa-solid fa-qrcode text-white/70" aria-hidden="true"></i>
  </div>
}

<div class="fixed top-24 right-0 my-4 px-4 pb-4
  bg-neutral-900 h-[calc(100%-180px)]
  border-y border-l rounded-l-2xl border-white/10
  transition-all duration-300 ease-in-out z-50 overflow-y-auto"
  [class.wl-ui-hidden]="uiChromeHidden()"
  [class.lg:w-96]="showPanelSettings()"
  [class.w-80]="showPanelSettings()"
  [class.opacity-100]="showPanelSettings()"
  [class.w-0]="!showPanelSettings()"
  [class.opacity-0]="!showPanelSettings()"
  [class.hidden]="displyPanel()">

  <div class="flex items-center justify-between 
    mb-4 py-4 z-1
    border-b border-white/10  
    sticky top-0 bg-neutral-900">
    <h2 class="text-md font-semibold uppercase tracking-wide text-white/85">{{ panelTitle() }}</h2>
    <button
      type="button"
      aria-label="Close panel"
      class="h-8 w-8 rounded-md border border-white/10 bg-neutral-700/50 text-white/90 hover:bg-neutral-600 transition-colors hover:cursor-pointer"
      (click)="requestClosePanel()">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <router-outlet name="panel"></router-outlet>

</div>

<!-- ── Mobile: bottom navigation bar ──────────────────────────────────────────
     Below lg the rail would crowd the wheel on a phone, so the same actions
     become a thumb-reachable bar. Home closes whatever panel is open. -->
<nav class="wl-bottom-bar lg:hidden fixed inset-x-0 z-50
  flex items-stretch
  border-t border-white/[0.08] bg-neutral-950/85 backdrop-blur-xl
  transition-all duration-300 ease-in-out"
  [class.wl-ui-hidden]="uiChromeHidden()"
  aria-label="Wheel controls">

  <button type="button"
    class="wl-bottom-bar-item"
    [class.wl-bottom-bar-item-active]="isHomeActive()"
    aria-label="Close settings panel and show the wheel"
    [attr.aria-current]="isHomeActive() ? 'true' : null"
    (click)="requestClosePanel()">
    <i class="fa-solid fa-house" aria-hidden="true"></i>
    <span>Home</span>
  </button>

  @for (action of panelActions; track action.path) {
    <button type="button"
      class="wl-bottom-bar-item"
      [class.wl-bottom-bar-item-active]="isPanelActive(action.path)"
      [attr.aria-label]="action.ariaLabel"
      [attr.aria-current]="isPanelActive(action.path) ? 'true' : null"
      (transitionend)="onActionTransitionEnd(action)"
      (click)="requestTogglePanel(action.path)">
      <i class="fa-solid" [class]="action.icon" aria-hidden="true"></i>
      <span>{{ action.caption }}</span>
    </button>
  }
</nav>

<!-- ── Mobile: floating utilities ─────────────────────────────────────────────
     Deliberately kept off the bar: these are toggles, not destinations. The
     chrome toggle stays reachable while the chrome is hidden — it is the only
     way back. -->
<div class="lg:hidden fixed w-12 h-12 rounded-xl
  border border-white/[0.08] bg-neutral-950/60 backdrop-blur-sm
  flex items-center justify-center hover:cursor-pointer
  transition-all duration-300 ease-in-out z-50
  hover:border-amber-400/50 hover:bg-amber-400/10"
  [class.top-26]="!uiChromeHidden()"
  [class.top-10]="uiChromeHidden()"
  [class.right-4]="!showPanelSettings()"
  [class.right-[21rem]]="showPanelSettings()"
  [class]="uiChromeHidden() ? 'border-amber-400/50! ring-0 bg-amber-400/10!' : ''"
  role="button"
  tabindex="0"
  [attr.aria-label]="uiChromeToggleAriaLabel()"
  [attr.aria-pressed]="uiChromeHidden()"
  (click)="requestUiChromeToggle()"
  (keydown.enter)="requestUiChromeToggle()"
  (keydown.space)="requestUiChromeToggle(); $event.preventDefault()">
  <i class="fa-solid text-white/70" [class.fa-eye-slash]="!uiChromeHidden()" [class.fa-eye]="uiChromeHidden()" aria-hidden="true"></i>
</div>

@if (canShowQrButton()) {
  <div class="lg:hidden fixed top-42 w-12 h-12 rounded-xl
    border border-white/[0.08] bg-neutral-950/60 backdrop-blur-sm
    flex items-center justify-center hover:cursor-pointer
    transition-all duration-300 ease-in-out z-50
    hover:border-amber-400/50 hover:bg-amber-400/10"
    [class.wl-ui-hidden]="uiChromeHidden()"
    [class.right-4]="!showPanelSettings()"
    [class.right-[21rem]]="showPanelSettings()"
    [class]="qrModalOpen() ? 'border-amber-400/50! ring-0 bg-amber-400/10!' : ''"
    role="button"
    tabindex="0"
    aria-label="Open wheel QR code"
    (click)="requestOpenQr()"
    (keydown.enter)="requestOpenQr()"
    (keydown.space)="requestOpenQr(); $event.preventDefault()">
    <i class="fa-solid fa-qrcode text-white/70" aria-hidden="true"></i>
  </div>
}

<!-- ── Desktop: right-hand rail (unchanged behaviour) ─────────────────────── -->
@for (action of panelActions; track action.path; let i = $index) {
  <div class="hidden lg:flex fixed
    w-12 h-12 rounded-xl
    border border-white/[0.08] bg-neutral-950/60 backdrop-blur-sm
    items-center justify-center hover:cursor-pointer
    transition-all duration-300 ease-in-out z-50
    hover:border-amber-400/50 hover:bg-amber-400/10 hover:shadow-[0_0_16px_rgba(245,158,11,0.15)]"
    [style.top.rem]="desktopTopRem(i)"
    [class.wl-ui-hidden]="uiChromeHidden()"
    [class]="isPanelActive(action.path) ? 'border-amber-400/50! ring-0 bg-amber-400/10!' : ''"
    [class.right-8]="!showPanelSettings()"
    [class.lg:right-100]="showPanelSettings()"
    role="button"
    tabindex="0"
    [attr.aria-label]="action.ariaLabel"
    (transitionend)="onActionTransitionEnd(action)"
    (click)="requestTogglePanel(action.path)"
    (keydown.enter)="requestTogglePanel(action.path)"
    (keydown.space)="requestTogglePanel(action.path); $event.preventDefault()">
    <i class="fa-solid text-white/70" [class]="action.icon" aria-hidden="true"></i>
  </div>
}

<div class="hidden lg:flex fixed
  w-12 h-12 rounded-xl
  border border-white/[0.08] bg-neutral-950/60 backdrop-blur-sm
  items-center justify-center hover:cursor-pointer
  transition-all duration-300 ease-in-out z-50
  hover:border-amber-400/50 hover:bg-amber-400/10 hover:shadow-[0_0_16px_rgba(245,158,11,0.15)]"
  [style.top.rem]="uiChromeHidden() ? 2.5 : uiChromeToggleTopRem"
  [class]="uiChromeHidden() ? 'border-amber-400/50! ring-0 bg-amber-400/10!' : ''"
  [class.right-8]="!showPanelSettings()"
  [class.lg:right-100]="showPanelSettings()"
  role="button"
  tabindex="0"
  [attr.aria-label]="uiChromeToggleAriaLabel()"
  [attr.aria-pressed]="uiChromeHidden()"

  (keydown.enter)="requestUiChromeToggle()"
  (keydown.space)="requestUiChromeToggle(); $event.preventDefault()">
  <i class="fa-solid text-white/70" [class.fa-eye-slash]="!uiChromeHidden()" [class.fa-eye]="uiChromeHidden()" aria-hidden="true"></i>
</div>

@if (canShowQrButton()) {
  <div class="hidden lg:flex fixed
    w-12 h-12 rounded-xl
    border border-white/[0.08] bg-neutral-950/60 backdrop-blur-sm
    items-center justify-center hover:cursor-pointer
    transition-all duration-300 ease-in-out z-50
    hover:border-amber-400/50 hover:bg-amber-400/10 hover:shadow-[0_0_16px_rgba(245,158,11,0.15)]"
    [style.top.rem]="qrButtonTopRem"
    [class.wl-ui-hidden]="uiChromeHidden()"
    [class]="qrModalOpen() ? 'border-amber-400/50! ring-0 bg-amber-400/10!' : ''"
    [class.right-8]="!showPanelSettings()"
    [class.lg:right-100]="showPanelSettings()"

    tabindex="0"
    aria-label="Open wheel QR code"
    (click)="requestOpenQr()"
    (keydown.enter)="requestOpenQr()"

<!-- ── Settings drawer (shared by both layouts) ───────────────────────────── -->
<div class="fixed top-24 right-0 my-4 px-4 pb-4
  bg-neutral-900
  h-[calc(100%-180px-var(--wl-bottom-bar-offset)-var(--wl-bottom-bar-height))]
  lg:h-[calc(100%-180px)]
  border-y border-l rounded-l-2xl border-white/10
  shadow-[-12px_0_40px_rgba(0,0,0,0.45)]
  transition-all duration-300 ease-in-out z-50 overflow-y-auto"
  [class.wl-ui-hidden]="uiChromeHidden()"
  [class.lg:w-96]="showPanelSettings()"
  [class.w-80]="showPanelSettings()"
  [class.opacity-100]="showPanelSettings()"
  [class.w-0]="!showPanelSettings()"
  [class.opacity-0]="!showPanelSettings()"
  [class.hidden]="displyPanel()">

  <div class="flex items-center justify-between 
    mb-4 py-4 z-1
    border-b border-white/10  
    sticky top-0 bg-neutral-900">
    <h2 class="text-base font-semibold uppercase tracking-wide text-white/85">{{ panelTitle() }}</h2>
    <button
      type="button"
      aria-label="Close panel"
      class="h-8 w-8 rounded-xl border border-white/10 bg-white/[0.06] text-white/80 hover:bg-white/15 hover:text-white transition-all duration-200 hover:cursor-pointer"
      (click)="requestClosePanel()">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <router-outlet name="panel"></router-outlet>

</div>

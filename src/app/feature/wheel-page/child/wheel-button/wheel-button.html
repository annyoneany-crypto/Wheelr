<div class="fixed top-28
  w-12 h-12 rounded-full
  border border-white/10 bg-neutral-800
  flex items-center justify-center hover:cursor-pointer
  transition-all duration-300 ease-in-out z-50
  hover:border-yellow-400 hover:ring-2 hover:ring-yellow-400/40"
  [class.wl-ui-hidden]="uiChromeHidden()"
  [class.border-yellow-400]="isPanelActive('users')"
  [class.ring-2]="isPanelActive('users')"
  [class.ring-yellow-400/40]="isPanelActive('users')"
  [class.right-8]="!showPanelSettings()"
  [class.right-[21rem]]="showPanelSettings()"
  [class.lg:right-100]="showPanelSettings()"
  role="button"
  tabindex="0"
  aria-label="Open users panel"
  (transitionend)="requestUsersButtonTransitionEnd()"
  (click)="requestTogglePanel('users')"
  (keydown.enter)="requestTogglePanel('users')"
  (keydown.space)="requestTogglePanel('users'); $event.preventDefault()">
  <i class="fa-solid fa-user-plus text-white/80 z-50" aria-hidden="true"></i>
</div>

<div class="fixed
  w-12 h-12 rounded-full
  border border-white/10 bg-neutral-800
  flex items-center justify-center hover:cursor-pointer
  transition-all duration-300 ease-in-out z-50
  hover:border-yellow-400 hover:ring-2 hover:ring-yellow-400/40"
  [class.top-92]="!uiChromeHidden()"
  [class.top-4]="uiChromeHidden()"
  [class.border-yellow-400]="uiChromeHidden()"
  [class.ring-2]="uiChromeHidden()"
  [class.ring-yellow-400/40]="uiChromeHidden()"
  [class.right-8]="!showPanelSettings()"
  [class.right-[21rem]]="showPanelSettings()"
  [class.lg:right-100]="showPanelSettings()"
  role="button"
  tabindex="0"
  [attr.aria-label]="uiChromeToggleAriaLabel()"
  [attr.aria-pressed]="uiChromeHidden()"
  (click)="requestUiChromeToggle()"
  (keydown.enter)="requestUiChromeToggle()"
  (keydown.space)="requestUiChromeToggle(); $event.preventDefault()">
  <i class="fa-solid text-white/80" [class.fa-eye-slash]="!uiChromeHidden()" [class.fa-eye]="uiChromeHidden()" aria-hidden="true"></i>
</div>

@if (canShowQrButton()) {
  <div class="fixed
    w-12 h-12 rounded-full
    border border-white/10 bg-neutral-800
    flex items-center justify-center hover:cursor-pointer
    transition-all duration-300 ease-in-out z-50
    hover:border-yellow-400 hover:ring-2 hover:ring-yellow-400/40"
    [class.wl-ui-hidden]="uiChromeHidden()"
    [class.border-yellow-400]="qrModalOpen()"
    [class.ring-2]="qrModalOpen()"
    [class.ring-yellow-400/40]="qrModalOpen()"
    [class.top-[27rem]]="!uiChromeHidden()"
    [class.top-16]="uiChromeHidden()"
    [class.right-8]="!showPanelSettings()"
    [class.right-[21rem]]="showPanelSettings()"
    [class.lg:right-100]="showPanelSettings()"
    role="button"
    tabindex="0"
    aria-label="Open wheel QR code"
    (click)="requestOpenQr()"
    (keydown.enter)="requestOpenQr()"
    (keydown.space)="requestOpenQr(); $event.preventDefault()">
    <i class="fa-solid fa-qrcode text-white/80" aria-hidden="true"></i>
  </div>
}

<div class="fixed top-24 right-0 my-4 p-4
  bg-neutral-800 h-[calc(100%-130px)]
  border-y border-l rounded-l-md border-white/10
  transition-all duration-300 ease-in-out z-50 overflow-y-auto"
  [class.wl-ui-hidden]="uiChromeHidden()"
  [class.lg:w-96]="showPanelSettings()"
  [class.w-80]="showPanelSettings()"
  [class.opacity-100]="showPanelSettings()"
  [class.w-0]="!showPanelSettings()"
  [class.opacity-0]="!showPanelSettings()"
  [class.hidden]="displyPanel()">

  <div class="mb-4 flex items-center justify-between border-b border-white/10 pb-3">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-white/85">{{ panelTitle() }}</h2>
    <button
      type="button"
      aria-label="Close panel"
      class="h-8 w-8 rounded-full border border-white/15 bg-neutral-700/70 text-white/90 hover:bg-neutral-600 transition-colors"
      (click)="requestClosePanel()">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <router-outlet name="panel"></router-outlet>

</div>

<aside
  class="fixed z-40 hidden lg:flex flex-col rounded-2xl border border-white/10 bg-neutral-900/70 backdrop-blur-md p-4 shadow-[0_0_30px_rgba(0,0,0,0.35)] transition-all duration-300"
  [class.wl-ui-hidden]="uiHidden()"
  [class.left-24]="isLeft()"
  [class.right-24]="isRight() && !settingsPanelOpen()"
  [class.right-[21rem]]="isRight() && settingsPanelOpen()"
  [class.top-1/2]="isSide()"
  [class.-translate-y-1/2]="isSide()"
  [class.left-1/2]="isHorizontal()"
  [class.-translate-x-1/2]="isHorizontal()"
  [class.top-24]="isTop()"
  [class.bottom-20]="isBottom()"
  [class.w-72]="isSide()"
  [class.h-[50vh]]="isSide()"
  [class.w-[54rem]]="isHorizontal()"
  [class.max-w-[80vw]]="isHorizontal()"
  [class.h-[34vh]]="isHorizontal()"
  aria-label="Winners list">
  <div class="flex items-center justify-between border-b border-white/10 pb-3">
    <h2 class="text-xs font-semibold uppercase tracking-[0.18em] text-white/80">Winners</h2>
    <span class="rounded-full border border-yellow-400/40 bg-yellow-400/15 px-2 py-0.5 text-xs font-semibold text-yellow-200">
      {{ entriesCount() }}
    </span>
  </div>

  <div class="mt-3 flex-1 overflow-y-auto pr-1">
    @if (entriesCount() === 0) {
      <p class="rounded-lg border border-white/10 bg-black/20 p-3 text-sm text-white/60">
        No winners yet. Start spinning to fill this list.
      </p>
    } @else {
      <div class="space-y-2">
        @for (entry of entries(); track entry.id) {
          <article class="rounded-lg border border-white/10 bg-black/25 p-3">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <p class="text-base font-semibold text-white leading-tight truncate">{{ entry.name }}</p>
                <p class="mt-1 text-xs text-white/70 truncate">{{ entry.wheelName }}</p>
                <p class="mt-1 text-[0.7rem] uppercase tracking-[0.14em] text-yellow-300/85">{{ entry.timestamp }}</p>
              </div>
              <button
                type="button"
                class="h-7 w-7 shrink-0 rounded-full border border-white/20 bg-neutral-800/80 text-white/85 transition-colors hover:bg-red-500/20 hover:text-red-200 hover:cursor-pointer"
                [attr.aria-label]="'Remove winner ' + entry.name"
                (click)="requestRemove(entry.id)">
                <i class="fa-solid fa-trash text-xs" aria-hidden="true"></i>
              </button>
            </div>
          </article>
        }
      </div>
    }
  </div>
</aside>

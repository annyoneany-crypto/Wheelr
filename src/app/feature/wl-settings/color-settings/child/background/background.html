<div class="border-b border-white/10 pb-4">
  <div class="flex items-center justify-between">
    <label class="wl-settings-label">
      <i class="fa-solid fa-image mr-2" aria-hidden="true"></i>Background
    </label>
    <i class="fa-solid fa-eraser text-white/50 hover:text-white hover:cursor-pointer transition-colors" title="Reset Background" (click)="resetBackground()"></i>
  </div>

  <!-- Background type tabs -->
  <div class="flex mb-4" role="tablist" aria-label="Background type">
    <button
      type="button"
      role="tab"
      id="bg-tab-color"
      [attr.aria-selected]="selectedTab() === 'color'"
      aria-controls="bg-panel-color"
      (click)="selectTab('color')"
      class="flex-1 py-1 border rounded-l-xl text-sm font-semibold transition-all duration-200 hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
      [class.bg-amber-400/15]="selectedTab() === 'color'"
      [class.text-amber-300]="selectedTab() === 'color'"
      [class.border-amber-400/50]="selectedTab() === 'color'"
      [class.bg-white/[0.04]]="selectedTab() !== 'color'"
      [class.text-white/70]="selectedTab() !== 'color'"
      [class.border-white/10]="selectedTab() !== 'color'">
      Color
    </button>

    <button
      type="button"
      role="tab"
      id="bg-tab-image"
      [attr.aria-selected]="selectedTab() === 'image'"
      aria-controls="bg-panel-image"
      (click)="selectTab('image')"
      class="flex-1 py-1 border rounded-r-xl text-sm font-semibold transition-all duration-200 hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
      [class.bg-amber-400/15]="selectedTab() === 'image'"
      [class.text-amber-300]="selectedTab() === 'image'"
      [class.border-amber-400/50]="selectedTab() === 'image'"
      [class.bg-white/[0.04]]="selectedTab() !== 'image'"
      [class.text-white/70]="selectedTab() !== 'image'"
      [class.border-white/10]="selectedTab() !== 'image'">
      Image
    </button>
  </div>

  <div class="space-y-3">
    @if (selectedTab() === 'color') {
      <div id="bg-panel-color" role="tabpanel" aria-labelledby="bg-tab-color" class="space-y-2">
        <input
          type="color"
          [value]="wheelConfigurator.bgColor()"
          (input)="onBgColorChange($event)"
          class="w-full h-10 rounded-xl cursor-pointer border border-white/10">
        <p class="text-xs text-white/40">Choose a solid color for the background.</p>
      </div>
    }

    @if (selectedTab() === 'image') {
      <div id="bg-panel-image" role="tabpanel" aria-labelledby="bg-tab-image" class="space-y-3">
        <button
          type="button"
          (click)="bgFileInput.click()"
          class="w-full py-2.5 rounded-xl text-sm font-semibold bg-white/[0.06] hover:cursor-pointer text-white border border-white/10 hover:border-amber-400/40 hover:bg-amber-400/10 transition-all duration-200">
          <i class="fa-solid fa-upload mr-1.5" aria-hidden="true"></i>Upload background image
        </button>

        <input
          #bgFileInput
          type="file"
          (change)="onBgFileSelected($event)"
          accept="image/*"
          class="hidden">

        @if (hasBgImage()) {
          <div class="preview-wrapper">
            <img
              [src]="wheelConfigurator.bgImage()"
              alt="Preview of the selected background"
              class="preview-image">
          </div>
        } @else {
          <p class="text-xs text-white/40">No image uploaded.</p>
        }
      </div>
    }

  </div>
</div>

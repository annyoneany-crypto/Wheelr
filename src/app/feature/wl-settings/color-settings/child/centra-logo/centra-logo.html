<div class="mb-6 p-4 bg-neutral-900 rounded-xl border border-neutral-700">
  <div class="flex items-center justify-between">
    <label class="block text-sm font-semibold text-yellow-400 mb-3 uppercase tracking-wider">
      Central Logo
    </label>
    <i class="fa-solid fa-eraser text-white hover:cursor-pointer" title="Reset Central Logo" (click)="resetCenterLogo()"></i>
  </div>

  <div class="flex mb-4" role="tablist" aria-label="Central logo type">
    <button
      type="button"
      role="tab"
      id="center-tab-color"
      [attr.aria-selected]="selectedTab() === 'color'"
      aria-controls="center-panel-color"
      (click)="selectTab('color')"
      class="flex-1 py-0.5 border rounded-l-md text-sm font-semibold transition-colors hover:cursor-pointer"
      [class.bg-yellow-500]="selectedTab() === 'color'"
      [class.text-neutral-900]="selectedTab() === 'color'"
      [class.border-yellow-500]="selectedTab() === 'color'"
      [class.bg-neutral-800]="selectedTab() !== 'color'"
      [class.text-white]="selectedTab() !== 'color'"
      [class.border-neutral-700]="selectedTab() !== 'color'">
      Color
    </button>

    <button
      type="button"
      role="tab"
      id="center-tab-image"
      [attr.aria-selected]="selectedTab() === 'image'"
      aria-controls="center-panel-image"
      (click)="selectTab('image')"
      class="flex-1 py-0.5 border rounded-r-md text-sm font-semibold transition-colors hover:cursor-pointer"
      [class.bg-yellow-500]="selectedTab() === 'image'"
      [class.text-neutral-900]="selectedTab() === 'image'"
      [class.border-yellow-500]="selectedTab() === 'image'"
      [class.bg-neutral-800]="selectedTab() !== 'image'"
      [class.text-white]="selectedTab() !== 'image'"
      [class.border-neutral-700]="selectedTab() !== 'image'">
      Image
    </button>
  </div>

  <div class="flex items-center justify-end gap-2 mb-2">
      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('s')"
        class="px-3 py-1 rounded-lg text-xs font-semibold border transition-colors"
        [class.bg-neutral-700]="wheelConfigurator.centerLogoSize() === 's'"
        [class.border-yellow-400]="wheelConfigurator.centerLogoSize() === 's'"
        [class.text-white]="wheelConfigurator.centerLogoSize() === 's'"
        [class.bg-neutral-800]="wheelConfigurator.centerLogoSize() !== 's'"
        [class.border-neutral-700]="wheelConfigurator.centerLogoSize() !== 's'"
        [class.text-neutral-200]="wheelConfigurator.centerLogoSize() !== 's'">
        S
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('m')"
        class="px-3 py-1 rounded-lg text-xs font-semibold border transition-colors"
        [class.bg-neutral-700]="wheelConfigurator.centerLogoSize() === 'm'"
        [class.border-yellow-400]="wheelConfigurator.centerLogoSize() === 'm'"
        [class.text-white]="wheelConfigurator.centerLogoSize() === 'm'"
        [class.bg-neutral-800]="wheelConfigurator.centerLogoSize() !== 'm'"
        [class.border-neutral-700]="wheelConfigurator.centerLogoSize() !== 'm'"
        [class.text-neutral-200]="wheelConfigurator.centerLogoSize() !== 'm'">
        M
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('l')"
        class="px-3 py-1 rounded-lg text-xs font-semibold border transition-colors"
        [class.bg-neutral-700]="wheelConfigurator.centerLogoSize() === 'l'"
        [class.border-yellow-400]="wheelConfigurator.centerLogoSize() === 'l'"
        [class.text-white]="wheelConfigurator.centerLogoSize() === 'l'"
        [class.bg-neutral-800]="wheelConfigurator.centerLogoSize() !== 'l'"
        [class.border-neutral-700]="wheelConfigurator.centerLogoSize() !== 'l'"
        [class.text-neutral-200]="wheelConfigurator.centerLogoSize() !== 'l'">
        L
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('xl')"
        class="px-3 py-1 rounded-lg text-xs font-semibold border transition-colors"
        [class.bg-neutral-700]="wheelConfigurator.centerLogoSize() === 'xl'"
        [class.border-yellow-400]="wheelConfigurator.centerLogoSize() === 'xl'"
        [class.text-white]="wheelConfigurator.centerLogoSize() === 'xl'"
        [class.bg-neutral-800]="wheelConfigurator.centerLogoSize() !== 'xl'"
        [class.border-neutral-700]="wheelConfigurator.centerLogoSize() !== 'xl'"
        [class.text-neutral-200]="wheelConfigurator.centerLogoSize() !== 'xl'">
        XL
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('xxl')"
        class="px-3 py-1 rounded-lg text-xs font-semibold border transition-colors hidden lg:block"
        [class.bg-neutral-700]="wheelConfigurator.centerLogoSize() === 'xxl'"
        [class.border-yellow-400]="wheelConfigurator.centerLogoSize() === 'xxl'"
        [class.text-white]="wheelConfigurator.centerLogoSize() === 'xxl'"
        [class.bg-neutral-800]="wheelConfigurator.centerLogoSize() !== 'xxl'"
        [class.border-neutral-700]="wheelConfigurator.centerLogoSize() !== 'xxl'"
        [class.text-neutral-200]="wheelConfigurator.centerLogoSize() !== 'xxl'">
        XXL
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('xxxl')"        
        class="px-3 py-1 rounded-lg text-xs font-semibold border transition-colors hidden lg:block"
        [class.bg-neutral-700]="wheelConfigurator.centerLogoSize() === 'xxxl'"
        [class.border-yellow-400]="wheelConfigurator.centerLogoSize() === 'xxxl'"
        [class.text-white]="wheelConfigurator.centerLogoSize() === 'xxxl'"
        [class.bg-neutral-800]="wheelConfigurator.centerLogoSize() !== 'xxxl'"
        [class.border-neutral-700]="wheelConfigurator.centerLogoSize() !== 'xxxl'"
        [class.text-neutral-200]="wheelConfigurator.centerLogoSize() !== 'xxxl'">
        XXXL
      </button>
  </div>

  @if (selectedTab() === 'color') {
    <div class="mb-3 space-y-1">
      <label for="center-text-input" class="block text-xs text-neutral-400 uppercase tracking-wide">
        Center text
      </label>
      <input
        id="center-text-input"
        type="text"
        [value]="wheelConfigurator.centerText()"
        (input)="onCenterTextChange($event)"
        maxlength="24"
        placeholder="SPIN"
        class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white placeholder:text-neutral-500">
    </div>

    <div id="center-panel-color" role="tabpanel" aria-labelledby="center-tab-color" class="space-y-2">
      <input
        type="color"
        [value]="wheelConfigurator.centerColor()"
        (input)="onCenterColorChange($event)"
        class="w-full h-10 rounded cursor-pointer">
      <p class="text-xs text-neutral-400">Color of the center circle.</p>
    </div>
  }

  @if (selectedTab() === 'image') {
    <div id="center-panel-image" role="tabpanel" aria-labelledby="center-tab-image" class="space-y-3">
      <button
        type="button"
        (click)="fileInput.click()"
        class="w-full py-2 rounded-lg text-sm font-semibold bg-neutral-800 text-white border border-neutral-700 hover:bg-neutral-700 hover:cursor-pointer transition-colors">
        Upload logo
      </button>

      <input
        #fileInput
        type="file"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="hidden">

      <!-- <input
        #urlInput
        type="text"
        placeholder="URL Logo..."
        (keyup.enter)="onCenterImageUrlEnter(urlInput.value)"
        class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white placeholder:text-neutral-500"> -->

      @if (hasCenterImage()) {
        <div class="preview-wrapper">
          <img
            [src]="wheelConfigurator.centerImage()"
            alt="Preview of the center logo"
            class="preview-image">
        </div>
      } @else {
        <p class="text-xs text-neutral-400">No logo uploaded.</p>
      }
    </div>
  }
</div>

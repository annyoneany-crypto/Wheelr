<div class="border-b border-white/10 pb-4">
  <div class="flex items-center justify-between">
    <label class="wl-settings-label">
      <i class="fa-solid fa-bullseye mr-2" aria-hidden="true"></i>Central Logo
    </label>
    <i class="fa-solid fa-eraser text-white/50 hover:text-white hover:cursor-pointer transition-colors" title="Reset Central Logo" (click)="resetCenterLogo()"></i>
  </div>

  <div class="flex mb-4" role="tablist" aria-label="Central logo type">
    <button
      type="button"
      role="tab"
      id="center-tab-color"
      [attr.aria-selected]="selectedTab() === 'color'"
      aria-controls="center-panel-color"
      (click)="selectTab('color')"
      class="flex-1 py-1 border rounded-l-xl text-sm font-semibold transition-all duration-200 hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
      [class.bg-amber-400/15]="selectedTab() === 'color'"
      [class.text-amber-300]="selectedTab() === 'color'"
      [class.border-amber-400/50]="selectedTab() === 'color'"
      [class.bg-white/[0.04]]="selectedTab() !== 'color'"
      [class.text-white/70]="selectedTab() !== 'color'"
      [class.border-white/10]="selectedTab() !== 'color'">
      Color
    </button>

    <button
      type="button"
      role="tab"
      id="center-tab-image"
      [attr.aria-selected]="selectedTab() === 'image'"
      aria-controls="center-panel-image"
      (click)="selectTab('image')"
      class="flex-1 py-1 border rounded-r-xl text-sm font-semibold transition-all duration-200 hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
      [class.bg-amber-400/15]="selectedTab() === 'image'"
      [class.text-amber-300]="selectedTab() === 'image'"
      [class.border-amber-400/50]="selectedTab() === 'image'"
      [class.bg-white/[0.04]]="selectedTab() !== 'image'"
      [class.text-white/70]="selectedTab() !== 'image'"
      [class.border-white/10]="selectedTab() !== 'image'">
      Image
    </button>
  </div>

  <div class="flex items-center justify-end gap-2 mb-2">
      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('s')"
        class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all duration-200 hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
        [class.bg-amber-400/15]="wheelConfigurator.centerLogoSize() === 's'"
        [class.border-amber-400/50]="wheelConfigurator.centerLogoSize() === 's'"
        [class.text-amber-300]="wheelConfigurator.centerLogoSize() === 's'"
        [class.bg-white/[0.04]]="wheelConfigurator.centerLogoSize() !== 's'"
        [class.border-white/10]="wheelConfigurator.centerLogoSize() !== 's'"
        [class.text-white/60]="wheelConfigurator.centerLogoSize() !== 's'">
        S
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('m')"
        class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all duration-200 hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
        [class.bg-amber-400/15]="wheelConfigurator.centerLogoSize() === 'm'"
        [class.border-amber-400/50]="wheelConfigurator.centerLogoSize() === 'm'"
        [class.text-amber-300]="wheelConfigurator.centerLogoSize() === 'm'"
        [class.bg-white/[0.04]]="wheelConfigurator.centerLogoSize() !== 'm'"
        [class.border-white/10]="wheelConfigurator.centerLogoSize() !== 'm'"
        [class.text-white/60]="wheelConfigurator.centerLogoSize() !== 'm'">
        M
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('l')"
        class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all duration-200 hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
        [class.bg-amber-400/15]="wheelConfigurator.centerLogoSize() === 'l'"
        [class.border-amber-400/50]="wheelConfigurator.centerLogoSize() === 'l'"
        [class.text-amber-300]="wheelConfigurator.centerLogoSize() === 'l'"
        [class.bg-white/[0.04]]="wheelConfigurator.centerLogoSize() !== 'l'"
        [class.border-white/10]="wheelConfigurator.centerLogoSize() !== 'l'"
        [class.text-white/60]="wheelConfigurator.centerLogoSize() !== 'l'">
        L
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('xl')"
        class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all duration-200 hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
        [class.bg-amber-400/15]="wheelConfigurator.centerLogoSize() === 'xl'"
        [class.border-amber-400/50]="wheelConfigurator.centerLogoSize() === 'xl'"
        [class.text-amber-300]="wheelConfigurator.centerLogoSize() === 'xl'"
        [class.bg-white/[0.04]]="wheelConfigurator.centerLogoSize() !== 'xl'"
        [class.border-white/10]="wheelConfigurator.centerLogoSize() !== 'xl'"
        [class.text-white/60]="wheelConfigurator.centerLogoSize() !== 'xl'">
        XL
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('xxl')"
        class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all duration-200 hidden lg:block hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
        [class.bg-amber-400/15]="wheelConfigurator.centerLogoSize() === 'xxl'"
        [class.border-amber-400/50]="wheelConfigurator.centerLogoSize() === 'xxl'"
        [class.text-amber-300]="wheelConfigurator.centerLogoSize() === 'xxl'"
        [class.bg-white/[0.04]]="wheelConfigurator.centerLogoSize() !== 'xxl'"
        [class.border-white/10]="wheelConfigurator.centerLogoSize() !== 'xxl'"
        [class.text-white/60]="wheelConfigurator.centerLogoSize() !== 'xxl'">
        XXL
      </button>

      <button
        type="button"
        (click)="wheelConfigurator.setCenterLogoSize('xxxl')"        
        class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all duration-200 hidden lg:block hover:cursor-pointer hover:border-amber-400/40 hover:bg-amber-400/10"
        [class.bg-amber-400/15]="wheelConfigurator.centerLogoSize() === 'xxxl'"
        [class.border-amber-400/50]="wheelConfigurator.centerLogoSize() === 'xxxl'"
        [class.text-amber-300]="wheelConfigurator.centerLogoSize() === 'xxxl'"
        [class.bg-white/[0.04]]="wheelConfigurator.centerLogoSize() !== 'xxxl'"
        [class.border-white/10]="wheelConfigurator.centerLogoSize() !== 'xxxl'"
        [class.text-white/60]="wheelConfigurator.centerLogoSize() !== 'xxxl'">
        XXXL
      </button>
  </div>

  @if (selectedTab() === 'color') {
    <div class="mb-3 space-y-1">
      <label for="center-text-input" class="block text-xs text-white/40 uppercase tracking-wide">
        Center text
      </label>
      <input
        id="center-text-input"
        type="text"
        [value]="wheelConfigurator.centerText()"
        (input)="onCenterTextChange($event)"
        maxlength="24"
        placeholder="SPIN"
        class="w-full bg-neutral-950 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white placeholder:text-white/40">
    </div>

    <div id="center-panel-color" role="tabpanel" aria-labelledby="center-tab-color" class="space-y-2">
      <input
        type="color"
        [value]="wheelConfigurator.centerColor()"
        (input)="onCenterColorChange($event)"
        class="w-full h-10 rounded-xl cursor-pointer border border-white/10">
      <p class="text-xs text-white/40">Color of the center circle.</p>
    </div>
  }

  @if (selectedTab() === 'image') {
    <div id="center-panel-image" role="tabpanel" aria-labelledby="center-tab-image" class="space-y-3">
      <button
        type="button"
        (click)="fileInput.click()"
        class="w-full mt-3 py-2.5 rounded-xl text-sm font-semibold bg-white/[0.06] hover:cursor-pointer text-white border border-white/10 hover:border-amber-400/40 hover:bg-amber-400/10 transition-all duration-200">
        <i class="fa-solid fa-upload mr-1.5" aria-hidden="true"></i>Upload logo
      </button>

      <input
        #fileInput
        type="file"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="hidden">

      <!-- <input
        #urlInput
        type="text"
        placeholder="URL Logo..."
        (keyup.enter)="onCenterImageUrlEnter(urlInput.value)"
        class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white placeholder:text-neutral-500"> -->

      @if (hasCenterImage()) {
        <div class="preview-wrapper">
          <img
            [src]="wheelConfigurator.centerImage()"
            alt="Preview of the center logo"
            class="preview-image">
        </div>
      } @else {
        <p class="text-xs text-white/40">No logo uploaded.</p>
      }
    </div>
  }
</div>

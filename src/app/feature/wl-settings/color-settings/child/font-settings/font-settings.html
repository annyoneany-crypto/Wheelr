<div class="border-b border-white/10 pb-4">
  <label class="wl-settings-label">
    <i class="fa-solid fa-font mr-2" aria-hidden="true"></i>Wheel Font
  </label>

  <div class="space-y-3">
    <select
      class="w-full bg-white/[0.06] border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white"
      [ngModel]="internalSelected()"
      (ngModelChange)="onSelect($event)">
      @for (font of availableFonts; track font.family) {
        <option [value]="font.family">{{ font.label }}</option>
      }
    </select>
  </div>


</div>

<div class="border-b border-white/10 pb-4">
  <label class="wl-settings-label">
    <i class="fa-solid fa-palette mr-2" aria-hidden="true"></i>Palette Wheel
  </label>

  <div class="grid grid-cols-2 gap-2">
    @for (palette of wheelConfigurator.palettes(); track palette.name) {
      <button
        (click)="wheelConfigurator.selectedPalette.set(palette)"
        class="p-2.5 rounded-xl border flex flex-col gap-2 transition-all duration-200 text-white hover:cursor-pointer"
        [class.border-amber-400/50]="wheelConfigurator.selectedPalette().name === palette.name"
        [class.bg-amber-400/10]="wheelConfigurator.selectedPalette().name === palette.name"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.1)]]="wheelConfigurator.selectedPalette().name === palette.name"
        [class.border-white/10]="wheelConfigurator.selectedPalette().name !== palette.name"
        [class.bg-white/[0.03]]="wheelConfigurator.selectedPalette().name !== palette.name"
        [class.hover:border-white/20]="wheelConfigurator.selectedPalette().name !== palette.name">
        <span class="text-[10px] uppercase font-bold tracking-wide">{{ palette.name }}</span>
        <div class="flex h-3.5 w-full rounded-full overflow-hidden shadow-inner">
          @for (color of palette.colors.slice(0, 5); track color) {
            <div [style.backgroundColor]="color" class="flex-1"></div>
          }
        </div>
      </button>
    }
  </div>

  <button
    type="button"
    (click)="toggleCustomPalette()"
    class="w-full mt-3 py-2.5 rounded-xl text-sm font-semibold bg-white/[0.06] hover:cursor-pointer text-white border border-white/10 hover:border-amber-400/40 hover:bg-amber-400/10 transition-all duration-200">
    @if (!showCustomPalette()) {
      <i class="fa-solid fa-plus mr-1.5" aria-hidden="true"></i>Create Custom Palette
    } @else {
      Close
    }
  </button>

  @if (showCustomPalette()) {
    <div class="mt-4 pt-4 border-t border-white/10 space-y-3">
      <label class="wl-settings-label">
        Custom Palette
      </label>

      <input
        type="text"
        class="w-full bg-white/[0.06] border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white placeholder:text-white/40"
        placeholder="Palette Name"
        [(ngModel)]="customName">

      <div class="grid grid-cols-3 gap-2">
        @for (i of colorIndexes; track i) {
          <div class="flex items-center gap-2">
            <input
              type="color"
              class="w-10 h-10 rounded-lg cursor-pointer border border-white/10"
              [(ngModel)]="customColors[i]">
          </div>
        }
      </div>

      <div class="flex gap-2 pt-1">
        <button
          type="button"
          (click)="saveCustomPalette()"
          class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-white/[0.06] hover:cursor-pointer text-white border border-white/10 hover:border-amber-400/40 hover:bg-amber-400/10 transition-all duration-200">
          Save
        </button>
        <button
          type="button"
          (click)="showCustomPalette.set(false)"
          class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-red-500/10 hover:cursor-pointer text-white border border-white/10 hover:border-red-400/40 hover:bg-red-500/20 transition-all duration-200">
          Cancel
        </button>
      </div>
    </div>
  }
</div>

<div class="border-b border-white/10 pb-4">
  <label class="wl-settings-label">
    <i class="fa-solid fa-stopwatch mr-2" aria-hidden="true"></i>Spin duration
  </label>

  <div class="flex items-center gap-3">
    <input
      type="number"
      min="1"
      class="w-24 bg-white/[0.06] border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white text-center"
      [(ngModel)]="durationSec"
    />
    <span class="text-sm text-white/60">seconds</span>
  </div>
</div>

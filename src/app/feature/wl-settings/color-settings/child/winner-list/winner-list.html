<div class="border-b border-white/10 pb-4">
  <label class="wl-settings-label" for="toggle-winners-list">
    <i class="fa-solid fa-trophy mr-2" aria-hidden="true"></i><span i18n="@@winnerList.title">Winners List</span>
  </label>

  <div class="flex items-center gap-3">
    <input
      id="toggle-winners-list"
      type="checkbox"
      class="wl-toggle"
      [checked]="wheelConfigurator.showWinnersList()"
      (change)="wheelConfigurator.setShowWinnersList($any($event.target).checked)"
    />
    <label for="toggle-winners-list" class="text-sm text-white cursor-pointer select-none">
      {{ toggleLabel() }}
    </label>
  </div>

  @if (wheelConfigurator.showWinnersList()) {
    <div class="mt-4 border-t border-white/10 pt-3">
      <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-white/50" i18n="@@winnerList.position">Panel position</p>
      <div class="grid grid-cols-2 gap-2">
        <button
          type="button"
          class="rounded-xl border px-3 py-2 text-sm font-semibold transition-all duration-200 hover:cursor-pointer"
          [class.border-amber-400/50]="wheelConfigurator.winnerPanelPosition() === 'left'"
          [class.bg-amber-400/15]="wheelConfigurator.winnerPanelPosition() === 'left'"
          [class.text-amber-300]="wheelConfigurator.winnerPanelPosition() === 'left'"
          [class.border-white/10]="wheelConfigurator.winnerPanelPosition() !== 'left'"
          [class.bg-white/[0.04]]="wheelConfigurator.winnerPanelPosition() !== 'left'"
          [class.text-white/70]="wheelConfigurator.winnerPanelPosition() !== 'left'"
          (click)="wheelConfigurator.setWinnerPanelPosition('left')" i18n="@@winnerList.left">
          Left
        </button>

        <button
          type="button"
          class="rounded-xl border px-3 py-2 text-sm font-semibold transition-all duration-200 hover:cursor-pointer"
          [class.border-amber-400/50]="wheelConfigurator.winnerPanelPosition() === 'top'"
          [class.bg-amber-400/15]="wheelConfigurator.winnerPanelPosition() === 'top'"
          [class.text-amber-300]="wheelConfigurator.winnerPanelPosition() === 'top'"
          [class.border-white/10]="wheelConfigurator.winnerPanelPosition() !== 'top'"
          [class.bg-white/[0.04]]="wheelConfigurator.winnerPanelPosition() !== 'top'"
          [class.text-white/70]="wheelConfigurator.winnerPanelPosition() !== 'top'"
          (click)="wheelConfigurator.setWinnerPanelPosition('top')" i18n="@@winnerList.top">
          Top
        </button>

        <button
          type="button"
          class="rounded-xl border px-3 py-2 text-sm font-semibold transition-all duration-200 hover:cursor-pointer"
          [class.border-amber-400/50]="wheelConfigurator.winnerPanelPosition() === 'right'"
          [class.bg-amber-400/15]="wheelConfigurator.winnerPanelPosition() === 'right'"
          [class.text-amber-300]="wheelConfigurator.winnerPanelPosition() === 'right'"
          [class.border-white/10]="wheelConfigurator.winnerPanelPosition() !== 'right'"
          [class.bg-white/[0.04]]="wheelConfigurator.winnerPanelPosition() !== 'right'"
          [class.text-white/70]="wheelConfigurator.winnerPanelPosition() !== 'right'"
          (click)="wheelConfigurator.setWinnerPanelPosition('right')" i18n="@@winnerList.right">
          Right
        </button>

        <button
          type="button"
          class="rounded-xl border px-3 py-2 text-sm font-semibold transition-all duration-200 hover:cursor-pointer"
          [class.border-amber-400/50]="wheelConfigurator.winnerPanelPosition() === 'bottom'"
          [class.bg-amber-400/15]="wheelConfigurator.winnerPanelPosition() === 'bottom'"
          [class.text-amber-300]="wheelConfigurator.winnerPanelPosition() === 'bottom'"
          [class.border-white/10]="wheelConfigurator.winnerPanelPosition() !== 'bottom'"
          [class.bg-white/[0.04]]="wheelConfigurator.winnerPanelPosition() !== 'bottom'"
          [class.text-white/70]="wheelConfigurator.winnerPanelPosition() !== 'bottom'"
          (click)="wheelConfigurator.setWinnerPanelPosition('bottom')" i18n="@@winnerList.bottom">
          Bottom
        </button>
      </div>
    </div>
  }
</div>

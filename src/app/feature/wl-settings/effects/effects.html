<div class="pb-4 space-y-6">

  <div class="space-y-2 border-b border-white/10 pb-4">
    <div class="wl-settings-label">
      Wheel Type
    </div>

    <div class="flex gap-2">
      <button
        type="button"
        (click)="setView('wheel')"
        class="flex-1 py-2.5 rounded-xl text-sm font-semibold border transition-all duration-200"
        [class.bg-amber-400/15]="wheelConfigurator.wheelView() === 'wheel'"
        [class.border-amber-400/50]="wheelConfigurator.wheelView() === 'wheel'"
        [class.text-amber-300]="wheelConfigurator.wheelView() === 'wheel'"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.15)]]="wheelConfigurator.wheelView() === 'wheel'"
        [class.bg-white/[0.04]]="wheelConfigurator.wheelView() !== 'wheel'"
        [class.border-white/10]="wheelConfigurator.wheelView() !== 'wheel'"
        [class.text-white/70]="wheelConfigurator.wheelView() !== 'wheel'"
        [class.hover:border-white/20]="wheelConfigurator.wheelView() !== 'wheel'">
        <i class="fa-solid fa-circle-notch mr-1.5" aria-hidden="true"></i>Wheel
      </button>

      <button
        type="button"
        (click)="setView('cards')"
        class="flex-1 py-2.5 rounded-xl text-sm font-semibold border transition-all duration-200"
        [class.bg-amber-400/15]="wheelConfigurator.wheelView() === 'cards'"
        [class.border-amber-400/50]="wheelConfigurator.wheelView() === 'cards'"
        [class.text-amber-300]="wheelConfigurator.wheelView() === 'cards'"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.15)]]="wheelConfigurator.wheelView() === 'cards'"
        [class.bg-white/[0.04]]="wheelConfigurator.wheelView() !== 'cards'"
        [class.border-white/10]="wheelConfigurator.wheelView() !== 'cards'"
        [class.text-white/70]="wheelConfigurator.wheelView() !== 'cards'"
        [class.hover:border-white/20]="wheelConfigurator.wheelView() !== 'cards'">
        <i class="fa-solid fa-clone mr-1.5" aria-hidden="true"></i>Cards
      </button>
    </div>
  </div>

  <div class="space-y-2 border-b border-white/10 pb-4">
    <div class="wl-settings-label">
      Winner Effect
    </div>

    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
      <button
        type="button"
        (click)="setWinnerEffect('fire')"
        class="group rounded-xl border px-3 py-3 text-left text-sm font-semibold transition-all duration-200"
        [class.bg-orange-500/15]="wheelConfigurator.winnerEffect() === 'fire'"
        [class.border-orange-400/50]="wheelConfigurator.winnerEffect() === 'fire'"
        [class.text-orange-300]="wheelConfigurator.winnerEffect() === 'fire'"
        [class.shadow-[0_0_14px_rgba(251,146,60,0.15)]]="wheelConfigurator.winnerEffect() === 'fire'"
        [class.bg-white/[0.04]]="wheelConfigurator.winnerEffect() !== 'fire'"
        [class.border-white/10]="wheelConfigurator.winnerEffect() !== 'fire'"
        [class.text-white/70]="wheelConfigurator.winnerEffect() !== 'fire'"
        [class.hover:border-white/20]="wheelConfigurator.winnerEffect() !== 'fire'">
        <i class="fa-solid fa-fire mr-2" aria-hidden="true"></i>Fire
      </button>

      <button
        type="button"
        (click)="setWinnerEffect('confetti')"
        class="group rounded-xl border px-3 py-3 text-left text-sm font-semibold transition-all duration-200"
        [class.bg-cyan-500/15]="wheelConfigurator.winnerEffect() === 'confetti'"
        [class.border-cyan-400/50]="wheelConfigurator.winnerEffect() === 'confetti'"
        [class.text-cyan-300]="wheelConfigurator.winnerEffect() === 'confetti'"
        [class.shadow-[0_0_14px_rgba(34,211,238,0.15)]]="wheelConfigurator.winnerEffect() === 'confetti'"
        [class.bg-white/[0.04]]="wheelConfigurator.winnerEffect() !== 'confetti'"
        [class.border-white/10]="wheelConfigurator.winnerEffect() !== 'confetti'"
        [class.text-white/70]="wheelConfigurator.winnerEffect() !== 'confetti'"
        [class.hover:border-white/20]="wheelConfigurator.winnerEffect() !== 'confetti'">
        <i class="fa-solid fa-party-horn mr-2" aria-hidden="true"></i>Confetti
      </button>

      <button
        type="button"
        (click)="setWinnerEffect('fireworks')"
        class="group rounded-xl border px-3 py-3 text-left text-sm font-semibold transition-all duration-200"
        [class.bg-fuchsia-500/15]="wheelConfigurator.winnerEffect() === 'fireworks'"
        [class.border-fuchsia-400/50]="wheelConfigurator.winnerEffect() === 'fireworks'"
        [class.text-fuchsia-300]="wheelConfigurator.winnerEffect() === 'fireworks'"
        [class.shadow-[0_0_14px_rgba(232,121,249,0.15)]]="wheelConfigurator.winnerEffect() === 'fireworks'"
        [class.bg-white/[0.04]]="wheelConfigurator.winnerEffect() !== 'fireworks'"
        [class.border-white/10]="wheelConfigurator.winnerEffect() !== 'fireworks'"
        [class.text-white/70]="wheelConfigurator.winnerEffect() !== 'fireworks'"
        [class.hover:border-white/20]="wheelConfigurator.winnerEffect() !== 'fireworks'">
        <i class="fa-solid fa-burst mr-2" aria-hidden="true"></i>Fireworks
      </button>
    </div>
  </div>

  <div class="space-y-2">
    <div class="wl-settings-label">
      Wheel Pointer
    </div>

    <div class="grid grid-cols-3 gap-2">
      <button
        type="button"
        (click)="setPointerType('drop')"
        class="flex flex-col items-center gap-1.5 rounded-xl border px-2 py-3 text-xs font-semibold transition-all duration-200"
        [class.bg-amber-400/15]="wheelConfigurator.pointerType() === 'drop'"
        [class.border-amber-400/50]="wheelConfigurator.pointerType() === 'drop'"
        [class.text-amber-300]="wheelConfigurator.pointerType() === 'drop'"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.15)]]="wheelConfigurator.pointerType() === 'drop'"
        [class.bg-white/[0.04]]="wheelConfigurator.pointerType() !== 'drop'"
        [class.border-white/10]="wheelConfigurator.pointerType() !== 'drop'"
        [class.text-white/70]="wheelConfigurator.pointerType() !== 'drop'"
        [class.hover:border-white/20]="wheelConfigurator.pointerType() !== 'drop'">
        <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 58C24 47 18 39 18 29C18 18 24.7 10 32 10C39.3 10 46 18 46 29C46 39 40 47 32 58Z" fill="currentColor" stroke="currentColor" stroke-width="2"/>
        </svg>
        Drop
      </button>

      <button
        type="button"
        (click)="setPointerType('arrow')"
        class="flex flex-col items-center gap-1.5 rounded-xl border px-2 py-3 text-xs font-semibold transition-all duration-200"
        [class.bg-amber-400/15]="wheelConfigurator.pointerType() === 'arrow'"
        [class.border-amber-400/50]="wheelConfigurator.pointerType() === 'arrow'"
        [class.text-amber-300]="wheelConfigurator.pointerType() === 'arrow'"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.15)]]="wheelConfigurator.pointerType() === 'arrow'"
        [class.bg-white/[0.04]]="wheelConfigurator.pointerType() !== 'arrow'"
        [class.border-white/10]="wheelConfigurator.pointerType() !== 'arrow'"
        [class.text-white/70]="wheelConfigurator.pointerType() !== 'arrow'"
        [class.hover:border-white/20]="wheelConfigurator.pointerType() !== 'arrow'">
        <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 8L18 52H28L32 40L36 52H46L32 8Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        Arrow
      </button>

      <button
        type="button"
        (click)="setPointerType('finger')"
        class="flex flex-col items-center gap-1.5 rounded-xl border px-2 py-3 text-xs font-semibold transition-all duration-200"
        [class.bg-amber-400/15]="wheelConfigurator.pointerType() === 'finger'"
        [class.border-amber-400/50]="wheelConfigurator.pointerType() === 'finger'"
        [class.text-amber-300]="wheelConfigurator.pointerType() === 'finger'"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.15)]]="wheelConfigurator.pointerType() === 'finger'"
        [class.bg-white/[0.04]]="wheelConfigurator.pointerType() !== 'finger'"
        [class.border-white/10]="wheelConfigurator.pointerType() !== 'finger'"
        [class.text-white/70]="wheelConfigurator.pointerType() !== 'finger'"
        [class.hover:border-white/20]="wheelConfigurator.pointerType() !== 'finger'">
        <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 6C29 6 27 8 27 11V34L21 28C19 26 16 26 14 28C12 30 12 33 14 35L28 54C29 56 31 57 33 57H44C48 57 51 54 51 50V30C51 27 49 25 46 25C45 25 44 25.5 43 26V23C43 20 41 18 38 18C37.5 18 37 18.1 36.5 18.3V11C36.5 8 34.5 6 32 6Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        Finger
      </button>

      <button
        type="button"
        (click)="setPointerType('star')"
        class="flex flex-col items-center gap-1.5 rounded-xl border px-2 py-3 text-xs font-semibold transition-all duration-200"
        [class.bg-amber-400/15]="wheelConfigurator.pointerType() === 'star'"
        [class.border-amber-400/50]="wheelConfigurator.pointerType() === 'star'"
        [class.text-amber-300]="wheelConfigurator.pointerType() === 'star'"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.15)]]="wheelConfigurator.pointerType() === 'star'"
        [class.bg-white/[0.04]]="wheelConfigurator.pointerType() !== 'star'"
        [class.border-white/10]="wheelConfigurator.pointerType() !== 'star'"
        [class.text-white/70]="wheelConfigurator.pointerType() !== 'star'"
        [class.hover:border-white/20]="wheelConfigurator.pointerType() !== 'star'">
        <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 4L39 24L60 24L43 37L49 58L32 45L15 58L21 37L4 24L25 24Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        Star
      </button>

      <button
        type="button"
        (click)="setPointerType('diamond')"
        class="flex flex-col items-center gap-1.5 rounded-xl border px-2 py-3 text-xs font-semibold transition-all duration-200"
        [class.bg-amber-400/15]="wheelConfigurator.pointerType() === 'diamond'"
        [class.border-amber-400/50]="wheelConfigurator.pointerType() === 'diamond'"
        [class.text-amber-300]="wheelConfigurator.pointerType() === 'diamond'"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.15)]]="wheelConfigurator.pointerType() === 'diamond'"
        [class.bg-white/[0.04]]="wheelConfigurator.pointerType() !== 'diamond'"
        [class.border-white/10]="wheelConfigurator.pointerType() !== 'diamond'"
        [class.text-white/70]="wheelConfigurator.pointerType() !== 'diamond'"
        [class.hover:border-white/20]="wheelConfigurator.pointerType() !== 'diamond'">
        <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 4L56 32L32 60L8 32Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        Diamond
      </button>

      <button
        type="button"
        (click)="setPointerType('bolt')"
        class="flex flex-col items-center gap-1.5 rounded-xl border px-2 py-3 text-xs font-semibold transition-all duration-200"
        [class.bg-amber-400/15]="wheelConfigurator.pointerType() === 'bolt'"
        [class.border-amber-400/50]="wheelConfigurator.pointerType() === 'bolt'"
        [class.text-amber-300]="wheelConfigurator.pointerType() === 'bolt'"
        [class.shadow-[0_0_12px_rgba(245,158,11,0.15)]]="wheelConfigurator.pointerType() === 'bolt'"
        [class.bg-white/[0.04]]="wheelConfigurator.pointerType() !== 'bolt'"
        [class.border-white/10]="wheelConfigurator.pointerType() !== 'bolt'"
        [class.text-white/70]="wheelConfigurator.pointerType() !== 'bolt'"
        [class.hover:border-white/20]="wheelConfigurator.pointerType() !== 'bolt'">
        <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M38 4L14 36H28L24 60L50 26H36Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        Bolt
      </button>
    </div>
  </div>
</div>

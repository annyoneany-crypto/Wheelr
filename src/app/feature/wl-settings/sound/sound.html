<label class="wl-settings-label">
  <i class="fa-solid fa-volume-high mr-2" aria-hidden="true"></i>Sound
</label>

<div class="space-y-4">
  <!-- Toggle for sound enabled/disabled -->
  <div class="flex items-center gap-3">
    <input
      type="checkbox"
      id="sound-enabled"
      class="wl-toggle"
      [checked]="wheelConfigurator.soundEnabled()"
      (change)="wheelConfigurator.soundEnabled.set(!wheelConfigurator.soundEnabled())"
    />
    <label for="sound-enabled" class="text-white text-sm cursor-pointer select-none">
      {{ wheelConfigurator.soundEnabled() ? 'Sound Enabled' : 'Muted' }}
    </label>
  </div>

  <!-- Custom audio upload section -->
  @if (wheelConfigurator.soundEnabled()) {
    <div class="pt-3 border-t border-white/10 space-y-3">
      <label class="wl-settings-label">
        <i class="fa-solid fa-music mr-1.5" aria-hidden="true"></i>Spin Audio
      </label>

      <div class="flex gap-2">
        <input
          type="file"
          accept="audio/*"
          class="flex-1 text-xs text-white file:bg-white/[0.06] file:border file:border-white/10 file:rounded-xl file:px-3 file:py-2 file:text-xs file:font-semibold file:text-white file:cursor-pointer file:hover:bg-white/10 file:transition-colors"
          (change)="onAudioFileSelected($event)"
        />
      </div>

      @if (wheelConfigurator.customAudio()) {
        <div class="flex items-center justify-between bg-white/[0.04] border border-white/10 rounded-xl p-3">
          <span class="text-xs text-white/80">
            <i class="fa-solid fa-music mr-2 text-amber-400" aria-hidden="true"></i>Spin audio loaded
          </span>
          <button
            type="button"
            (click)="clearCustomAudio()"
            class="py-1 px-2.5 text-xs font-semibold bg-red-500/10 text-red-300 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition-colors"
          >
            Remove
          </button>
        </div>
      }

      <!-- Winner audio upload section -->
      <div class="pt-3 border-t border-white/10 space-y-3">
        <label class="wl-settings-label">
          <i class="fa-solid fa-trophy mr-1.5" aria-hidden="true"></i>Winner Audio
        </label>

        <div class="flex gap-2">
          <input
            type="file"
            accept="audio/*"
            class="flex-1 text-xs text-white file:bg-white/[0.06] file:border file:border-white/10 file:rounded-xl file:px-3 file:py-2 file:text-xs file:font-semibold file:text-white file:cursor-pointer file:hover:bg-white/10 file:transition-colors"
            (change)="onWinnerAudioFileSelected($event)"
          />
        </div>

        @if (wheelConfigurator.winnerAudio()) {
          <div class="flex items-center justify-between bg-white/[0.04] border border-white/10 rounded-xl p-3">
            <span class="text-xs text-white/80">
              <i class="fa-solid fa-trophy mr-2 text-amber-400" aria-hidden="true"></i>Winner audio loaded
            </span>
            <button
              type="button"
              (click)="clearWinnerAudio()"
              class="py-1 px-2.5 text-xs font-semibold bg-red-500/10 text-red-300 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition-colors"
            >
              Remove
            </button>
          </div>
        }

        <!-- Countdown audio upload section -->
        <div class="pt-3 border-t border-white/10 space-y-3">
          <label class="wl-settings-label">
            <i class="fa-solid fa-clock mr-1.5" aria-hidden="true"></i>Countdown Audio
          </label>

          <div class="flex gap-2">
            <input
              type="file"
              accept="audio/*"
              class="flex-1 text-xs text-white file:bg-white/[0.06] file:border file:border-white/10 file:rounded-xl file:px-3 file:py-2 file:text-xs file:font-semibold file:text-white file:cursor-pointer file:hover:bg-white/10 file:transition-colors"
              (change)="onCountdownAudioFileSelected($event)"
            />
          </div>

          @if (wheelConfigurator.countdownAudio()) {
            <div class="flex items-center justify-between bg-white/[0.04] border border-white/10 rounded-xl p-3">
              <span class="text-xs text-white/80">
                <i class="fa-solid fa-clock mr-2 text-amber-400" aria-hidden="true"></i>Countdown audio loaded
              </span>
              <button
                type="button"
                (click)="clearCountdownAudio()"
                class="py-1 px-2.5 text-xs font-semibold bg-red-500/10 text-red-300 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition-colors"
              >
                Remove
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  }

  <div class="pt-3 border-t border-white/10 space-y-3">
    <div class="wl-settings-label">
      <i class="fa-solid fa-hourglass-half mr-1.5" aria-hidden="true"></i>Countdown
    </div>
    <div class="flex items-center gap-3">
      <input
        id="countdown-toggle-audio"
        type="checkbox"
        class="wl-toggle"
        [checked]="wheelConfigurator.countdownEnabled()"
        (change)="wheelConfigurator.setCountdownEnabled($any($event.target).checked)"
      />
      <label for="countdown-toggle-audio" class="text-sm text-white cursor-pointer select-none">
        Enable countdown
      </label>
    </div>

    @if (wheelConfigurator.countdownEnabled()) {
      <div class="flex items-center gap-3">
        <label for="countdown-start-audio" class="text-sm text-white/70">Start from</label>
        <input
          id="countdown-start-audio"
          type="number"
          min="1"
          [value]="wheelConfigurator.countdownStart()"
          (input)="wheelConfigurator.setCountdownStart($any($event.target).valueAsNumber)"
          class="w-16 rounded-xl bg-white/[0.06] border border-white/10 p-2 text-center text-white text-sm"
        />
      </div>
    }
  </div>
</div>

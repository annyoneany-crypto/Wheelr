<label class="wl-settings-label">
  <i class="fa-solid fa-volume-high mr-2" aria-hidden="true"></i><span i18n="@@sound.title">Sound</span>
</label>

<div class="space-y-4">
  <!-- Toggle for sound enabled/disabled -->
  <div class="flex items-center gap-3">
    <input
      type="checkbox"
      id="sound-enabled"
      class="wl-toggle"
      [checked]="wheelConfigurator.soundEnabled()"
      (change)="wheelConfigurator.soundEnabled.set(!wheelConfigurator.soundEnabled())"
    />
    <label for="sound-enabled" class="text-white text-sm cursor-pointer select-none">
      {{ soundToggleLabel() }}
    </label>
  </div>

  <!-- Custom audio upload section -->
  @if (wheelConfigurator.soundEnabled()) {
    <div class="pt-3 border-t border-white/10 space-y-3">
      <label class="wl-settings-label">
        <i class="fa-solid fa-music mr-1.5" aria-hidden="true"></i><span i18n="@@sound.spinAudio">Spin Audio</span>
      </label>

      <!-- The native file control labels itself in the *browser's* language, not
           the app's, so it is hidden behind a button we can translate. -->
      <button
        type="button"
        (click)="spinAudioInput.click()"
        class="w-full py-2.5 rounded-xl text-sm font-semibold bg-white/[0.06] hover:cursor-pointer text-white border border-white/10 hover:border-amber-400/40 hover:bg-amber-400/10 transition-all duration-200">
        <i class="fa-solid fa-upload mr-1.5" aria-hidden="true"></i><span i18n="@@sound.chooseFile">Choose an audio file</span>
      </button>

      <input
        #spinAudioInput
        type="file"
        accept="audio/*"
        class="hidden"
        (change)="onAudioFileSelected($event)"
      />

      @if (wheelConfigurator.customAudio()) {
        <div class="flex items-center justify-between bg-white/[0.04] border border-white/10 rounded-xl p-3">
          <span class="text-xs text-white/80">
            <i class="fa-solid fa-music mr-2 text-amber-400" aria-hidden="true"></i><span i18n="@@sound.spinLoaded">Spin audio loaded</span>
          </span>
          <button
            type="button"
            (click)="clearCustomAudio()"
            class="py-1 px-2.5 text-xs font-semibold bg-red-500/10 text-red-300 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition-colors"
          >
            <span i18n="@@sound.remove">Remove</span>
          </button>
        </div>
      }

      <!-- Winner audio upload section -->
      <div class="pt-3 border-t border-white/10 space-y-3">
        <label class="wl-settings-label">
          <i class="fa-solid fa-trophy mr-1.5" aria-hidden="true"></i><span i18n="@@sound.winnerAudio">Winner Audio</span>
        </label>

        <button
          type="button"
          (click)="winnerAudioInput.click()"
          class="w-full py-2.5 rounded-xl text-sm font-semibold bg-white/[0.06] hover:cursor-pointer text-white border border-white/10 hover:border-amber-400/40 hover:bg-amber-400/10 transition-all duration-200">
          <i class="fa-solid fa-upload mr-1.5" aria-hidden="true"></i><span i18n="@@sound.chooseFile">Choose an audio file</span>
        </button>

        <input
          #winnerAudioInput
          type="file"
          accept="audio/*"
          class="hidden"
          (change)="onWinnerAudioFileSelected($event)"
        />

        @if (wheelConfigurator.winnerAudio()) {
          <div class="flex items-center justify-between bg-white/[0.04] border border-white/10 rounded-xl p-3">
            <span class="text-xs text-white/80">
              <i class="fa-solid fa-trophy mr-2 text-amber-400" aria-hidden="true"></i><span i18n="@@sound.winnerLoaded">Winner audio loaded</span>
            </span>
            <button
              type="button"
              (click)="clearWinnerAudio()"
              class="py-1 px-2.5 text-xs font-semibold bg-red-500/10 text-red-300 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition-colors"
            >
              <span i18n="@@sound.remove">Remove</span>
            </button>
          </div>
        }

        <!-- Countdown audio upload section -->
        <div class="pt-3 border-t border-white/10 space-y-3">
          <label class="wl-settings-label">
            <i class="fa-solid fa-clock mr-1.5" aria-hidden="true"></i><span i18n="@@sound.countdownAudio">Countdown Audio</span>
          </label>

          <button
            type="button"
            (click)="countdownAudioInput.click()"
            class="w-full py-2.5 rounded-xl text-sm font-semibold bg-white/[0.06] hover:cursor-pointer text-white border border-white/10 hover:border-amber-400/40 hover:bg-amber-400/10 transition-all duration-200">
            <i class="fa-solid fa-upload mr-1.5" aria-hidden="true"></i><span i18n="@@sound.chooseFile">Choose an audio file</span>
          </button>

          <input
            #countdownAudioInput
            type="file"
            accept="audio/*"
            class="hidden"
            (change)="onCountdownAudioFileSelected($event)"
          />

          @if (wheelConfigurator.countdownAudio()) {
            <div class="flex items-center justify-between bg-white/[0.04] border border-white/10 rounded-xl p-3">
              <span class="text-xs text-white/80">
                <i class="fa-solid fa-clock mr-2 text-amber-400" aria-hidden="true"></i><span i18n="@@sound.countdownLoaded">Countdown audio loaded</span>
              </span>
              <button
                type="button"
                (click)="clearCountdownAudio()"
                class="py-1 px-2.5 text-xs font-semibold bg-red-500/10 text-red-300 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition-colors"
              >
                <span i18n="@@sound.remove">Remove</span>
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  }

  <div class="pt-3 border-t border-white/10 space-y-3">
    <div class="wl-settings-label">
      <i class="fa-solid fa-hourglass-half mr-1.5" aria-hidden="true"></i><span i18n="@@sound.countdown">Countdown</span>
    </div>
    <div class="flex items-center gap-3">
      <input
        id="countdown-toggle-audio"
        type="checkbox"
        class="wl-toggle"
        [checked]="wheelConfigurator.countdownEnabled()"
        (change)="wheelConfigurator.setCountdownEnabled($any($event.target).checked)"
      />
      <label for="countdown-toggle-audio" class="text-sm text-white cursor-pointer select-none" i18n="@@sound.enableCountdown">
        Enable countdown
      </label>
    </div>

    @if (wheelConfigurator.countdownEnabled()) {
      <div class="flex items-center gap-3">
        <label for="countdown-start-audio" class="text-sm text-white/70" i18n="@@sound.startFrom">Start from</label>
        <input
          id="countdown-start-audio"
          type="number"
          min="1"
          [value]="wheelConfigurator.countdownStart()"
          (input)="wheelConfigurator.setCountdownStart($any($event.target).valueAsNumber)"
          class="w-16 rounded-xl bg-white/[0.06] border border-white/10 p-2 text-center text-white text-sm"
        />
      </div>
    }
  </div>
</div>

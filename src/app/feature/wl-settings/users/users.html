<div class="h-[calc(100%-4rem)] flex flex-col gap-3">
  
  <div class="flex gap-2">
    <button
      type="button"
      (click)="cleanAndShuffleUsers()"
      class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-b from-white/[0.08] to-white/[0.03] text-white border border-white/10 hover:border-amber-400/40 hover:bg-amber-400/10 transition-all duration-200">
      <i class="fa-solid fa-shuffle mr-1.5" aria-hidden="true"></i>Shuffle
    </button>

    <button
      type="button"
      (click)="clearUsers()"
      class="py-2.5 px-4 rounded-xl text-sm font-semibold bg-red-500/10 text-red-300 border border-red-500/20 hover:bg-red-500/20 hover:border-red-400/40 transition-all duration-200">
      <i class="fa-solid fa-trash-can mr-1.5" aria-hidden="true"></i>Clear
    </button>
  </div>

<!-- section for adding a name multiple times -->
  <div class="flex gap-2 items-end">
    <div class="flex-1">
      <label class="sr-only" for="new-name">Name</label>
      <input
        id="new-name"
        type="text"
        class="w-full px-3 py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white placeholder:text-white/40 text-sm"
        placeholder="Name"
        [ngModel]="newName()"
        (ngModelChange)="newName.set($event)"
      />
    </div>
    <div class="w-20">
      <label class="sr-only" for="repeat-count">Repeat count</label>
      <input
        id="repeat-count"
        type="number"
        min="1"
        class="w-full px-3 py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white text-sm text-center"
        [ngModel]="repeatCount()"
        (ngModelChange)="repeatCount.set($event)"
      />
    </div>
    <button
      type="button"
      (click)="addRepeated()"
      class="py-2.5 px-4 rounded-xl text-sm font-semibold bg-gradient-to-b from-amber-400 to-amber-500 text-neutral-950 hover:from-amber-300 hover:to-amber-400 shadow-[0_2px_10px_rgba(245,158,11,0.25)] transition-all duration-200 active:scale-95"
    >
      <i class="fa-solid fa-plus mr-1" aria-hidden="true"></i>Add
    </button>
  </div>

  <textarea
    class="w-full flex-1 text-white text-sm bg-white/[0.06] border border-white/10 px-3 py-3 rounded-xl placeholder:text-white/40 resize-none"
    [(ngModel)]="usersText"
    (ngModelChange)="userTextChange($event)"
    rows="5"
    placeholder="One name per line...">
  </textarea>

  <div class="flex gap-2 items-end">
    <div class="flex-1">
      <label class="sr-only" for="delete-name">Name to remove</label>
      <input
        id="delete-name"
        type="text"
        class="w-full px-3 py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white placeholder:text-white/40 text-sm"
        placeholder="Name to remove"
        [ngModel]="nameToRemove()"
        (ngModelChange)="nameToRemove.set($event)"
      />
    </div>
    <button
      type="button"
      (click)="removeNameFromUsers()"
      class="py-2.5 px-4 rounded-xl text-sm font-semibold bg-red-500/10 text-red-300 border border-red-500/20 hover:bg-red-500/20 hover:border-red-400/40 transition-all duration-200"
    >
      <i class="fa-solid fa-minus mr-1" aria-hidden="true"></i>Remove
    </button>
  </div>
</div>

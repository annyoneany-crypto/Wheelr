<div class="fixed inset-0 bg-black/60 pointer-events-none z-55" aria-hidden="true"></div>
<div class="absolute inset-0 flex items-center justify-center z-60 pointer-events-none" role="dialog" aria-modal="true" aria-label="Winner result dialog">
    <canvas #fireCanvas class="absolute inset-0 w-full h-full" aria-hidden="true"></canvas>
    <div class="relative z-10 scale-150 animate-in fade-in zoom-in duration-500 flex flex-col items-center gap-4 pointer-events-auto" aria-live="polite">
        <div class="bg-black/80 backdrop-blur-sm border-2 border-orange-500 px-6 py-2 rounded-lg shadow-[0_0_30px_rgba(249,115,22,0.6)]">
            <p class="text-orange-500 text-xs font-bold uppercase tracking-tighter text-center">Winner</p>
            <p class="text-white text-center text-2xl font-black drop-shadow-[0_2px_10px_rgba(255,255,255,0.5)]">{{ wheelConfigurator.winner() }}</p>
        </div>
        <div class="flex flex-col gap-2">
            <button 
                type="button"
                aria-label="Close winner dialog"
                (click)="resetWinner(); $event.stopPropagation()"
                class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-200 shadow-lg">
                Close
            </button>
            <div class="flex gap-2">
                <button
                    type="button"
                    aria-label="Remove one winner entry from users"
                    (click)="removeSingleWinnerEntryFromUsers(); $event.stopPropagation()"
                    class="border border-amber-700 bg-neutral-800/60 hover:bg-amber-800/80 hover:cursor-pointer text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200 shadow-lg">
                    Remove 1 entry
                </button>
                <button
                    type="button"
                    aria-label="Remove all winner entries from users"
                    (click)="removeWinnerFromUsers(); $event.stopPropagation()"
                    class="border border-red-800 bg-neutral-800/60 hover:bg-red-800/80 hover:cursor-pointer text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200 shadow-lg">
                    Remove all entries
                </button>
            </div>
        </div>
    </div>
</div>

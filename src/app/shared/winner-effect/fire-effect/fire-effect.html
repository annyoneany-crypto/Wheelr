<div class="fixed inset-0 bg-black/60 pointer-events-none z-55" aria-hidden="true"></div>
<div class="fixed inset-0 flex items-center justify-center z-60 pointer-events-none p-3 sm:p-4" role="dialog" aria-modal="true" [attr.aria-label]="winnerTitle()">
    <canvas #fireCanvas class="absolute inset-0 w-full h-full" aria-hidden="true"></canvas>
    <div class="relative z-10 w-full max-w-88 sm:max-w-md scale-100 sm:scale-125 animate-in fade-in zoom-in duration-500 flex flex-col items-center gap-4 pointer-events-auto" aria-live="polite">
        <div
            class="w-full bg-black/80 backdrop-blur-sm border-2 px-4 sm:px-6 py-2 rounded-lg"
            [style.border-color]="winnerBorderColor()"
            [style.box-shadow]="winnerBoxShadow()">
            <p
                class="text-xs font-bold uppercase tracking-tighter text-center"
                [style.color]="winnerLabelColor()">Winner</p>
            <p class="text-white text-center text-xl sm:text-2xl font-black drop-shadow-[0_2px_10px_rgba(255,255,255,0.5)] wrap-break-word">{{ wheelConfigurator.winner() }}</p>
        </div>
        <div class="w-full flex flex-col gap-2">
            <button 
                type="button"
                aria-label="Close winner dialog"
                (click)="resetWinner(); $event.stopPropagation()"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-200 shadow-lg">
                Close
            </button>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button
                    type="button"
                    aria-label="Remove one winner entry from users"
                    (click)="removeSingleWinnerEntryFromUsers(); $event.stopPropagation()"
                    class="w-full border border-amber-700 bg-neutral-800/60 hover:bg-amber-800/80 hover:cursor-pointer text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200 shadow-lg">
                    Remove 1 entry
                </button>
                <button
                    type="button"
                    aria-label="Remove all winner entries from users"
                    (click)="removeWinnerFromUsers(); $event.stopPropagation()"
                    class="w-full border border-red-800 bg-neutral-800/60 hover:bg-red-800/80 hover:cursor-pointer text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200 shadow-lg">
                    Remove all entries
                </button>
            </div>
        </div>
    </div>
</div>

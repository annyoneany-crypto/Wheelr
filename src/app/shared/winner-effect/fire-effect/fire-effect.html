<div class="fixed inset-0 bg-black/70 pointer-events-none z-55" aria-hidden="true"></div>
<div class="fixed inset-0 flex items-center justify-center z-60 pointer-events-none p-3 sm:p-4" role="dialog" aria-modal="true" [attr.aria-label]="winnerTitle()">
    <canvas #fireCanvas class="absolute inset-0 w-full h-full" aria-hidden="true"></canvas>
    <div class="relative z-10 w-full max-w-88 sm:max-w-md scale-100 sm:scale-125 wl-animate-modal flex flex-col items-center gap-4 pointer-events-auto" aria-live="polite">
        <div
            class="w-full bg-black/85 backdrop-blur-md border-2 px-4 sm:px-6 py-3 rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.5)]"
            [style.border-color]="winnerBorderColor()"
            [style.box-shadow]="winnerBoxShadow()">
            <p
                class="text-[0.65rem] font-black uppercase tracking-[0.25em] text-center"
                [style.color]="winnerLabelColor()">Winner</p>
            <p class="text-white text-center text-2xl sm:text-3xl font-black mt-1 drop-shadow-[0_2px_10px_rgba(255,255,255,0.5)] wrap-break-word">{{ wheelConfigurator.winner() }}</p>
        </div>
        <div class="w-full flex flex-col gap-2">
            <button 
                type="button"
                aria-label="Close winner dialog"
                (click)="resetWinner(); $event.stopPropagation()"
                class="w-full bg-gradient-to-b from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-neutral-950 font-bold py-3 px-6 rounded-xl transition-all duration-200 shadow-[0_4px_20px_rgba(245,158,11,0.35)] active:scale-95">
                Close
            </button>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button
                    type="button"
                    aria-label="Remove one winner entry from users"
                    (click)="removeSingleWinnerEntryFromUsers(); $event.stopPropagation()"
                    class="w-full border border-amber-500/30 bg-white/[0.06] backdrop-blur-sm hover:bg-amber-500/15 hover:border-amber-400/50 hover:cursor-pointer text-white font-semibold py-2.5 px-4 rounded-xl transition-all duration-200">
                    Remove 1 entry
                </button>
                <button
                    type="button"
                    aria-label="Remove all winner entries from users"
                    (click)="removeWinnerFromUsers(); $event.stopPropagation()"
                    class="w-full border border-red-500/30 bg-white/[0.06] backdrop-blur-sm hover:bg-red-500/15 hover:border-red-400/50 hover:cursor-pointer text-white font-semibold py-2.5 px-4 rounded-xl transition-all duration-200">
                    Remove all entries
                </button>
            </div>
        </div>
    </div>
</div>
